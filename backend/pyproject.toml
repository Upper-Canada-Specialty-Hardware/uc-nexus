[tool.poetry]
name = "uc-nexus-backend"
version = "0.1.0"
description = "UC Nexus Hardware Management System - Backend"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.139.2"
strawberry-graphql = {version = "0.321.0", extras = ["fastapi"]}
sqlalchemy = "2.0.51"
alembic = "1.18.5"
psycopg2-binary = "2.9.12"
python-dotenv = "1.2.2"
uvicorn = {version = "0.51.0", extras = ["standard"]}
boto3 = ">=1.35.0"
httpx = ">=0.27.0"
pyjwt = {extras = ["crypto"], version = "^2.13.0"}
rapidfuzz = ">=3.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.9.0"
pytest = ">=8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "UP042",  # StrEnum migration risky with DB-stored enum values
    "E712",   # == False/True is correct for SQLAlchemy column expressions
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # migration files have long auto-generated lines

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

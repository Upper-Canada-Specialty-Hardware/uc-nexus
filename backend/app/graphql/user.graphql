# User Module SDL Reference
# Source of truth: Strawberry resolvers in app/schemas/user.py
#
# Users do not live in Postgres. They live in Clerk, and `app/repositories/user_repository.py` talks
# to the Clerk Backend API - which is why roles are not a database enum, and why a role requirement
# costs a network call while a plain signed-in one does not. Since #423 that call is made once per
# request rather than once per gated field (app/auth.py, app/auth_policy.py).
#
# This file existed only as a cross-reference from shop_assembly.graphql ("ClerkUser is in
# user.graphql") until #344; the reference was dangling. It is written now so the pointer resolves.
#
# Every operation below is Admin/Manager-gated (#415), now from ROOT_FIELD_POLICY in
# app/auth_policy.py rather than a line in each resolver (#423). They were all reachable with no
# session until #415, which made updateUserRoles a self-service grant of the role that gates relay
# provisioning, relay deletion, buyer assignments and the GP job/buyer writes.

# One Clerk account as the app sees it. `roles` comes from Clerk publicMetadata, not from the session
# token, so it is fetched rather than decoded.
type ClerkUser {
  id: String!
  first_name: String!
  last_name: String!
  email: String!
  # Known values: "Admin/Manager" (app/auth.ADMIN_ROLE) and "Shop Assembly Manager"
  # (app/auth.SHOP_ASSEMBLY_MANAGER_ROLE). Free-form in Clerk, so this is not an enum.
  roles: [String!]!
  # The GP BUYERID this account acts as (#216). Null until an admin links it; createPo and
  # registerPoInGp enforce that the caller has one. Since #409 the admin picks it from GP's live
  # buyer master (Query.gpBuyersDetailed) rather than typing it, so the UI no longer offers an id GP
  # never registered - taPoHdr would reject that one at PO time anyway (error 269). Note the guard is
  # the picker, not this mutation: updateUserGpBuyerId still accepts any string, and rows written as
  # free text before #409 are unmigrated, which is why the Buyers grid flags unregistered ids.
  gp_buyer_id: String
  # The GP company this account belongs to - its tenant (#637), from Clerk publicMetadata.company.
  # Null means unassigned. An Admin/Manager is unscoped whatever this says; everyone else reads and
  # writes only rows belonging to this company, and an unassigned non-admin reads nothing.
  company: String
  image_url: String!
}

type Query {
  # Admin-gated: returns every account's email, roles and GP buyer id.
  users: [ClerkUser!]!
  # Shop-assembly team members for the manager assignment picker (#330), defined in
  # shop_assembly.graphql because that is the module that consumes it. Manager-gated.
  # shopAssemblyMembers: [ClerkUser!]!
}

type Mutation {
  # Admin-gated, and the gate is the whole protection: nothing downstream re-checks who asked, and
  # the roles set here include Admin/Manager itself.
  updateUserRoles(userId: String!, roles: [String!]!): ClerkUser!
  # Admin-driven display-name change (#240).
  updateUserName(userId: String!, firstName: String!, lastName: String!): ClerkUser!
  # Link a UC Nexus account to the GP BUYERID it acts as (#216); null clears it.
  updateUserGpBuyerId(userId: String!, gpBuyerId: String): ClerkUser!
  # Assign the account's GP company - its tenant (#637); null clears it. Decides which company's
  # rows the account can read and write at all, so it sits at the same bar as updateUserRoles.
  updateUserCompany(userId: String!, company: String): ClerkUser!
}

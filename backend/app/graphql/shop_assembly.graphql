# Shop Assembly Module SDL Reference
# Source of truth: Strawberry resolvers in app/schemas/

type ShopAssemblyRequest {
  id: ID!
  request_number: String!
  project_id: ID!
  status: ShopAssemblyRequestStatus!
  created_by: String!
  approved_by: String
  rejected_by: String
  rejection_reason: String
  created_at: DateTime!
  approved_at: DateTime
  rejected_at: DateTime
  # Something happened to this request after it was created that the acceptor must know about
  # (#342): a schedule re-upload landed under it, or the reservations backfill could not cover it.
  integrity_note: String
  # A PENDING request whose minted pull was cancelled was returned by that cancellation (#613).
  # Human-readable explanation of the reappearance, else null. Derived, never stored.
  return_note: String
  openings: [ShopAssemblyOpening!]!
}

enum ShopAssemblyRequestStatus {
  PENDING
  APPROVED
  REJECTED
}

type ShopAssemblyOpening {
  id: ID!
  # Legacy SAR parent, nullable since #222 - openings created from Start a Request hang off the
  # PullRequest below. Still written for new rows (import stamps both), which is what lets a request's
  # openings be found after a cancellation nulls pull_request_id (#343).
  shop_assembly_request_id: ID
  # The shop-assembly PullRequest this opening was created under. Null before the request is accepted,
  # and again after its pull is cancelled.
  pull_request_id: ID
  opening_id: ID!
  # Resolved from the source Opening at request time; populated by myWork, assembleList and
  # pullRequestOpenings.
  opening_number: String
  building: String
  floor: String
  # Door leaf this assembly work unit is for (#311): 1 or 2, or null (legacy whole-opening unit).
  leaf: Int
  # NOT_PULLED until the warehouse confirms this opening's cart is built, then PULLED (#343). Never
  # PARTIAL: one cart cannot be half-built.
  pull_status: PullStatus!
  # When this opening's cart was confirmed staged, and by whom (#343). Null while NOT_PULLED, and on
  # openings staged before per-opening staging existed (they were staged wholesale).
  staged_at: DateTime
  staged_by: String
  # Stable Clerk user id the opening is claimed by (#324); assigned_to is the display name.
  assigned_to_user_id: String
  assigned_to: String
  assembly_status: AssemblyStatus!
  completed_at: DateTime
  items: [ShopAssemblyOpeningItem!]!
}

enum PullStatus {
  NOT_PULLED
  # Only ever an aggregate reading over a *set* of openings - "some carts built, some not" (#343).
  # Derived for a whole PullRequest (PullRequest.staging_status); never written to an opening.
  PARTIAL
  PULLED
}

enum AssemblyStatus {
  PENDING
  # Some hardware is recorded against the leaf but it is not fully dispositioned yet (#340).
  IN_PROGRESS
  COMPLETED
}

type ShopAssemblyOpeningItem {
  id: ID!
  shop_assembly_opening_id: ID!
  hardware_category: String!
  product_code: String!
  # Owed: what the hardware schedule says this leaf takes. Never reduced by scarcity.
  quantity: Int!
  # Allocated: what the requester could claim out of available inventory when the request was sent,
  # and therefore what is reserved, pulled and physically arrives on the cart. 0 <= allocated <=
  # quantity, and 0 is legal on a line whose leaf is covered by its other lines.
  # Short = quantity - allocated_quantity, derived here and everywhere else - never stored, because
  # what a leaf is still missing is answered by the current schedule against what is on the leaf.
  allocated_quantity: Int!
  # Persisted assembly progress (#340). Remaining = allocated - installed - deficient, derived on the
  # client; completion is refused while any line still has remaining > 0. Short units sit outside
  # that sum - they were never pulled, so the bench has nothing to disposition.
  installed_quantity: Int!
  deficient_quantity: Int!
  # Units whose replacement pull has completed but which are not on the leaf yet (#341). Non-zero
  # only on a COMPLETED opening: while the leaf is still on the bench an arrived replacement just
  # lowers deficient_quantity and becomes remaining work again. On a finished leaf that would break
  # the completion invariant, so the unit moves deficient -> replacement_pending instead and
  # installed + deficient + replacement_pending stays equal to allocated_quantity.
  replacement_pending_quantity: Int!
}

# One outstanding replacement install on an already-completed leaf (#341). Not a
# ShopAssemblyOpening: the opening is COMPLETED and stays that way.
type ReplacementWorkItem {
  shop_assembly_opening_item_id: ID!
  shop_assembly_opening_id: ID!
  project_id: ID!
  opening_number: String!
  leaf: Int
  building: String
  floor: String
  hardware_category: String!
  product_code: String!
  pending_quantity: Int!
  assigned_to_user_id: String
  assigned_to: String
  opening_item_id: ID
  # SHIPPED_OUT means the replacement arrived after the leaf left the building: still listed so the
  # hardware is not silently stranded, but installReplacement refuses it - it needs reallocation.
  opening_item_state: OpeningItemState
}

input InstallReplacementInput {
  shop_assembly_opening_item_id: ID!
  # Bounded by replacement_pending_quantity, so this can never inflate a leaf.
  quantity: Int!
}

input AssignOpeningsInput {
  opening_ids: [ID!]!
  assigned_to_user_id: String!
  assigned_to: String!
}

input AssemblyProgressItemInput {
  shop_assembly_opening_item_id: ID!
  # ABSOLUTE running total of units fitted to the leaf; omit to leave the line's count alone.
  # Re-sending the same value is a no-op, so a retried save cannot double-count.
  installed_quantity: Int
  # INCREMENTAL - units condemned now, on top of any already flagged. Each is returned to inventory
  # flagged deficient and given a PR-REPL replacement line immediately, so it is one-way and a
  # deficient_reason is required with it.
  flag_deficient_quantity: Int
  deficient_reason: String
}

input RecordAssemblyProgressInput {
  opening_id: ID!
  items: [AssemblyProgressItemInput!]!
}

# --- Pipeline observability (#344) ---
# Derived, never stored. Every count below comes from a grouped scalar aggregate, so the summary list
# costs a fixed five statements whether it is scoped to one project or to all of them.

# How far one door leaf has travelled. The stage of a *request* is the stage of its least-advanced
# opening - what is holding it up, not its best news. REJECTED and CANCELLED are off the ladder
# rather than at the end of it: they are the two ways a leaf leaves the pipeline unassembled.
enum PipelineStage {
  REQUESTED    # the request exists; no pull minted
  ACCEPTED     # the pull exists but is not approved, so nothing has been picked
  PULLING      # the pull is approved and stock deducted; this cart is not built
  STAGED       # this cart is built (#343) and nobody is holding it
  ASSIGNED     # claimed by an assembler, nothing recorded yet
  IN_PROGRESS  # hardware recorded onto the leaf, not fully dispositioned (#340)
  COMPLETED    # an OpeningItem exists for the leaf
  SHIPPED      # the assembled leaf has left the building
  REJECTED     # the source request was rejected, releasing its claim (#342)
  CANCELLED    # the pull was cancelled and restocked (#343); the request is back at PENDING
}

type PipelineOpening {
  shop_assembly_opening_id: ID!
  opening_number: String!
  leaf: Int
  building: String
  floor: String
  location: String
  stage: PipelineStage!
  pull_status: PullStatus!
  staged_at: DateTime
  staged_by: String
  assigned_to_user_id: String
  assigned_to: String
  assembly_status: AssemblyStatus!
  completed_at: DateTime
  # Owed by the schedule vs what the request could claim out of inventory. The three progress
  # counters partition allocated_unit_count; short_unit_count is the rest and was never pulled, so
  # no work at the bench can account for it and the leaf completes without it.
  planned_unit_count: Int!
  allocated_unit_count: Int!
  short_unit_count: Int!
  installed_unit_count: Int!
  deficient_unit_count: Int!
  replacement_pending_unit_count: Int!
  # Units still owed to this leaf: condemned-and-unreplaced plus arrived-but-not-fitted (#341).
  awaiting_replacement_unit_count: Int!
  # Replacement hardware is sitting for a leaf that has already shipped (#341). installReplacement
  # refuses it; it belongs to reallocation.
  replacement_arrived_after_ship: Boolean!
  opening_item_id: ID
  opening_item_state: OpeningItemState
  # Where the assembled leaf was put away, "aisle-row-bay", or null if it has not been located.
  assembled_location: String
}

type AssemblyPipelineSummary {
  request_id: ID!
  request_number: String!
  project_id: ID!
  project_code: String
  project_name: String
  request_status: ShopAssemblyRequestStatus!
  created_by: String!
  created_at: DateTime!
  accepted_by: String
  accepted_at: DateTime
  rejected_by: String
  rejected_at: DateTime
  # The same #342 note the accept screen shows as an amber alert.
  integrity_note: String
  # The live pull, never a cancelled one (#343 made request_number unique among live pulls only).
  pull_request_id: ID
  pull_request_status: PullRequestStatus
  pull_approved_at: DateTime
  pull_completed_at: DateTime
  # Derived staging rollup - the same reading PullRequest.staging_status gives (#343). Null when the
  # request has no openings, which is "not applicable", never "nothing staged".
  staging_status: PullStatus
  # Cancellation history: a cancelled pull keeps its number and hands its openings back to a PENDING
  # request, so without this the request would read as never having been accepted.
  cancelled_pull_count: Int!
  last_cancelled_at: DateTime
  last_cancelled_by: String
  last_cancellation_reason: String
  opening_count: Int!
  staged_opening_count: Int!
  assigned_opening_count: Int!
  in_progress_opening_count: Int!
  completed_opening_count: Int!
  shipped_opening_count: Int!
  planned_unit_count: Int!
  # Sent short: a request can be legitimately complete and still not have delivered its full bill of
  # hardware, and nothing else on this row would say so.
  allocated_unit_count: Int!
  short_unit_count: Int!
  installed_unit_count: Int!
  deficient_unit_count: Int!
  replacement_pending_unit_count: Int!
  awaiting_replacement_opening_count: Int!
  replacement_after_ship_opening_count: Int!
  # Openings carrying at least one line that was never fully pulled.
  short_opening_count: Int!
  stage: PipelineStage!
}

type AssemblyPipeline {
  summary: AssemblyPipelineSummary!
  openings: [PipelineOpening!]!
}

# No item_results since #340: completion reads the persisted per-item progress instead.
input CompleteOpeningInput {
  opening_id: ID!
  aisle: String
  row: String
  bay: String
}

# Every field below is gated on an authenticated caller (#339) except where a stronger role
# requirement is noted. The requirement lives in ROOT_FIELD_POLICY (app/auth_policy.py) and is
# applied before the resolver runs (#423); it did not change any field's arguments.
type Query {
  # projectId is optional; omit it for the cross-project view.
  assembleList(projectId: ID): [ShopAssemblyOpening!]!
  myWork(assignedToUserId: String!): [ShopAssemblyOpening!]!
  # Where every shop-assembly request has got to (#344), newest first. Omit projectId for the
  # All-Projects view - the repository runs a fixed five statements either way.
  assemblyPipelineSummaries(projectId: ID, status: ShopAssemblyRequestStatus): [AssemblyPipelineSummary!]!
  # One request down to the individual door leaf. The header counts come from the same aggregates the
  # list above uses, so the two screens cannot disagree. NOT_FOUND if the request does not exist.
  assemblyPipeline(requestId: ID!): AssemblyPipeline!
  # Replacement installs outstanding on already-completed leaves (#341). assignedToUserId scopes it
  # to one assembler's My Work - the opening keeps the assignment it was completed under, so this
  # needs no new assignment concept. Rows whose leaf has shipped are included on purpose.
  replacementWork(assignedToUserId: String, projectId: ID): [ReplacementWorkItem!]!
  # reopenableOnly (#325): keep only requests whose minted PR is still PENDING (the Approved/reopen view).
  shopAssemblyRequests(projectId: ID, status: ShopAssemblyRequestStatus, reopenableOnly: Boolean! = false): [ShopAssemblyRequest!]!
  # Manager assignment picker (#330). Manager-gated (Shop Assembly Manager). ClerkUser is in user.graphql.
  shopAssemblyMembers: [ClerkUser!]!
}

type Mutation {
  # Self-assignment is open to any signed-in user; assigning to *another* user additionally
  # requires the Shop Assembly Manager role (#330).
  # A manager (the role-checked branch) may reassign an opening someone else is holding, including an
  # IN_PROGRESS one - progress is persisted, so the handoff is lossless (#340). A self-claim never
  # can: it takes the is-self branch, which does not pass allow_reassign.
  assignOpenings(input: AssignOpeningsInput!): [ShopAssemblyOpening!]!
  # PENDING or IN_PROGRESS only (#340); a completed opening cannot be unassigned.
  removeOpeningFromUser(openingId: ID!): ShopAssemblyOpening!
  # Save partial assembly progress without finishing (#340). Requires the opening to be PULLED,
  # assigned, and not completed. First save flips it PENDING -> IN_PROGRESS. Flagged units are
  # returned to inventory flagged deficient and given a PR-REPL replacement line immediately.
  recordAssemblyProgress(input: RecordAssemblyProgressInput!): ShopAssemblyOpening!
  # Refuses (#339) if a live OpeningItem already exists for this (opening, leaf) - CONFLICT.
  # Refuses (#340) with VALIDATION_ERROR while any unit is still unaccounted for
  # (installed + deficient < quantity on some line), or if nothing at all was installed, which would
  # mint an empty assembled leaf. OpeningItemHardware quantities are the recorded installed counts.
  completeOpening(input: CompleteOpeningInput!): OpeningItem!
  # Fit arrived replacement hardware to a finished leaf (#341) - the one legitimate write to an
  # assembled leaf's hardware after completion. Appends or increments the leaf's OpeningItemHardware
  # row for that product and moves the units replacement_pending -> installed on the source line.
  # VALIDATION_ERROR if more than has arrived; INVALID_STATE_TRANSITION if the leaf is still on the
  # bench (record it as progress instead) or has already shipped (that is reallocation's problem).
  installReplacement(input: InstallReplacementInput!): OpeningItem!
  # Accept gate (#293). Any signed-in user. Accept mints the warehouse PullRequest and
  # is a **pure human gate** since #342: the hardware was reserved when the request was created, so
  # nothing is re-checked here. Reject is what releases that reservation. The approval is recorded
  # against the Clerk-authenticated caller (#427). The acceptedBy/rejectedBy arguments lingered as
  # ignored @deprecated no-ops for one deploy so stale tabs still validated, and came out in #438.
  acceptShopAssemblyRequest(id: ID!): ShopAssemblyRequest!
  rejectShopAssemblyRequest(id: ID!, reason: String): ShopAssemblyRequest!
  # Reopen (#325). Undoes an erroneous accept: APPROVED -> PENDING, hard-deletes the minted
  # PullRequest and re-points the openings off it. Refused if the warehouse has already worked the pull.
  reopenShopAssemblyRequest(id: ID!): ShopAssemblyRequest!
}

# Import Module SDL Reference
# Source of truth: Strawberry resolvers in app/schemas/

input ProjectInput {
  project_id: String!
  description: String
  job_site_name: String
  address: String
  city: String
  state: String
  zip: String
  contractor: String
  project_manager: String
  application: String
  submittal_job_no: String
  submittal_assignment_count: Int
  estimator_code: String
  titan_user_id: String
}

input OpeningInput {
  opening_number: String!
  building: String
  floor: String
  location: String
  location_to: String
  location_from: String
  hand: String
  width: String
  length: String
  door_thickness: String
  jamb_thickness: String
  door_type: String
  frame_type: String
  interior_exterior: String
  keying: String
  heading_no: String
  single_pair: String
  assignment_multiplier: String
}

input HardwareItemInput {
  opening_number: String!
  product_code: String!
  hardware_category: String!
  item_quantity: Int!
  unit_cost: Float
  unit_price: Float
  list_price: Float
  vendor_discount: Float
  markup_pct: Float
  vendor_no: String
  manufacturer: String
  phase_code: String
  item_category_code: String
  product_group_code: String
  submittal_id: String
}

input HardwareItemRef {
  opening_number: String!
  product_code: String!
  hardware_category: String!
}

input PODraftInput {
  po_number: String!
  vendor_name: String
  vendor_contact: String
  hardware_item_refs: [HardwareItemRef!]!
  line_item_aliases: [POLineItemOrderAsInput!]
}

input POLineItemOrderAsInput {
  hardware_category: String!
  product_code: String!
  order_as: String!
}

input ClassificationInput {
  hardware_category: String!
  product_code: String!
  unit_cost: Float!
  classification: Classification!
}

input ShippingOutPRDraftInput {
  request_number: String!
  requested_by: String!
  items: [ShippingOutPRDraftItemInput!]!
}

input ShippingOutPRDraftItemInput {
  item_type: PullRequestItemType!
  opening_number: String!
  # Required on OPENING_ITEM lines (#335): must name an IN_INVENTORY OpeningItem of this project.
  opening_item_id: ID
  # Door leaf the OPENING_ITEM line ships (#335). Null on LOOSE.
  leaf: Int
  hardware_category: String
  product_code: String
  requested_quantity: Int!
}

input SAROpeningInput {
  opening_number: String!
  items: [SAROpeningItemInput!]!
}

input SAROpeningItemInput {
  hardware_category: String!
  product_code: String!
  # Owed - the schedule's number for this leaf.
  quantity: Int!
  # What the allocator step assigned to this line out of available inventory, 0..quantity. Null means
  # "fully allocated" (= quantity), which keeps every non-allocator caller on the old all-or-nothing
  # behaviour: ask for the whole line, and bounce if it does not fit.
  allocated_quantity: Int
}

input FinalizeImportSessionInput {
  project: ProjectInput!
  openings: [OpeningInput!]!
  hardware_items: [HardwareItemInput!]
  po_drafts: [PODraftInput!]
  classifications: [ClassificationInput!]
  shipping_out_pr_drafts: [ShippingOutPRDraftInput!]
  include_shop_assembly_request: Boolean!
  shop_assembly_request_number: String
  shop_assembly_openings: [SAROpeningInput!]
  # Shipping deficiency guard (#341). An OPENING_ITEM line naming a leaf whose source shop-assembly
  # checklist still has units awaiting a replacement is refused with a VALIDATION_ERROR naming every
  # flagged leaf, unless this is true. Warn + confirm, never silent and never a hard block:
  # deliberate short-shipping is a real workflow, it just has to be a decision someone made. The
  # wizard sets it from its "Ship it short" confirmation.
  acknowledge_incomplete_leaves: Boolean! = false
}

input ReconciliationItemInput {
  opening_number: String!
  hardware_category: String!
  product_code: String!
  quantity_needed: Int!
}

# #293: Start a Task mints request entities (PENDING), not PullRequests. A signed-in user accepts
# them downstream, which mints the warehouse PullRequest. ShippingOutRequest is defined in
# shipping.graphql; ShopAssemblyRequest in shop_assembly.graphql.
type FinalizeImportResult {
  project: Project!
  purchase_orders: [PurchaseOrder!]!
  shipping_out_requests: [ShippingOutRequest!]!
  shop_assembly_request: ShopAssemblyRequest
}

type ReconciliationResult {
  opening_number: String!
  hardware_category: String!
  product_code: String!
  quantity: Int!
  status: ReconciliationStatus!
}

enum ReconciliationStatus {
  PO_DRAFTED
  ORDERED
  RECEIVED
  ASSEMBLING
  ASSEMBLED
  SHIPPING_OUT
  SHIPPED_OUT
  NOT_COVERED
}

type VendorCandidate {
  gpVendorId: String!
  gpVendorName: String!
  score: Float!
}

type VendorSuggestion {
  manufacturer: String!
  savedMapping: Boolean!
  candidates: [VendorCandidate!]!
}

type Query {
  projects: [Project!]!
  projectByScheduleId(projectId: String!): Project
  reconcileSchedule(projectId: ID!, items: [ReconciliationItemInput!]!): [ReconciliationResult!]!
  suggestVendorForManufacturer(gpCompany: String!, manufacturer: String!): VendorSuggestion!
}

type Mutation {
  finalizeImportSession(input: FinalizeImportSessionInput!): FinalizeImportResult!
}

# Warehouse Module SDL Reference
# Source of truth: Strawberry resolvers in app/schemas/

type ReceiveRecord {
  id: ID!
  po_id: ID!
  received_at: DateTime!
  received_by: String!
  created_at: DateTime!
  line_items: [ReceiveLineItem!]!
}

type ReceiveLineItem {
  id: ID!
  receive_record_id: ID!
  po_line_item_id: ID!
  hardware_category: String!
  product_code: String!
  quantity_received: Int!
  created_at: DateTime!
}

type InventoryLocation {
  id: ID!
  project_id: ID!
  # Null on a row that did not come from a receive: an allocation out of the stock pool, or a row
  # re-materialized by a deficiency return (#225) or a pull restock (#343).
  po_line_item_id: ID
  receive_line_item_id: ID
  stock_item_id: ID
  warehouse_id: ID
  hardware_category: String!
  product_code: String!
  quantity: Int!
  # Units on this row condemned and awaiting deficiency review. Both counts move together when a unit
  # is condemned, so `available` below is unchanged and the unit cannot be re-pulled.
  deficient_quantity: Int!
  # quantity - deficient_quantity. NOT the same "available" as projectInventoryAvailability's, which
  # also subtracts reservations (#342): this one answers "what is physically unspoken-for in the
  # building", that one answers "what may I claim".
  available: Int!
  aisle: String
  row: String
  bay: String
  received_at: DateTime!
  created_at: DateTime!
  updated_at: DateTime!
}

type InventoryHierarchyNode {
  hardware_category: String!
  product_codes: [ProductCodeNode!]!
  total_quantity: Int!
  total_available_quantity: Int!
  total_value: Float!
}

type ProductCodeNode {
  product_code: String!
  items: [InventoryLocation!]!
  total_quantity: Int!
  # Computed on both hierarchies since #344 reconciliation; the by-vendor one supplies 0.
  total_available_quantity: Int!
  total_value: Float!
}

type InventoryItemDetail {
  inventory_location: InventoryLocation!
  # Both null for a row with no originating PO line (see InventoryLocation.po_line_item_id).
  po_number: String
  classification: Classification
  unit_cost: Float
}

type OpeningItem {
  id: ID!
  project_id: ID!
  opening_id: ID!
  warehouse_id: ID
  opening_number: String!
  building: String
  floor: String
  location: String
  # Door leaf this assembled unit is (#311): 1 or 2, or null for a legacy whole-opening unit. One
  # OpeningItem per leaf, so a pair ships as two independently-located units.
  leaf: Int
  # The opening's total leaf count, the "N of M leaves shipped" denominator. Populated only by the
  # openingItems list resolver; null elsewhere.
  leaf_count: Int
  quantity: Int!
  assembly_completed_at: DateTime!
  state: OpeningItemState!
  aisle: String
  row: String
  bay: String
  created_at: DateTime!
  updated_at: DateTime!
  installed_hardware: [OpeningItemHardware!]!
  # Units this leaf is still owed (#341): condemned-and-unreplaced plus arrived-but-not-fitted,
  # summed from its source shop-assembly checklist lines. > 0 means the leaf is physically short of
  # what its hardware list claims, so the shipping wizard flags it and shipping it takes an explicit
  # acknowledgment. Populated only by openingItems / openingItemDetails / installReplacement; null
  # elsewhere, which reads as "not evaluated", never as "nothing owed".
  awaiting_replacement_quantity: Int
  # Units the schedule owed this leaf that its request never pulled - not available to claim when it
  # was sent, so nothing arrived and nothing is in flight. The other half of the same shipping
  # decision, kept separate because waiting fixes an awaiting-replacement unit and does nothing for
  # one of these. Same null-means-not-evaluated convention.
  never_pulled_quantity: Int
}

type OpeningItemHardware {
  id: ID!
  opening_item_id: ID!
  product_code: String!
  hardware_category: String!
  quantity: Int!
}

type OpeningItemDetail {
  opening_item: OpeningItem!
  installed_hardware: [OpeningItemHardware!]!
}

type PullRequest {
  id: ID!
  request_number: String!
  project_id: ID!
  source: PullRequestSource!
  status: PullRequestStatus!
  requested_by: String!
  assigned_to: String
  created_at: DateTime!
  updated_at: DateTime!
  approved_at: DateTime
  completed_at: DateTime
  cancelled_at: DateTime
  # Who cancelled the pull and why (#343). Null unless status is CANCELLED.
  cancelled_by: String
  cancellation_reason: String
  # Per-opening staging rollup, DERIVED and never stored (#343): NOT_PULLED / PARTIAL / PULLED read
  # over this pull's shop-assembly openings. PARTIAL is a statement about the *set* of openings, so
  # it has no place on any single opening's own pull_status - one cart is built or it is not.
  #
  # Null = staging does not apply, or was not evaluated. A shipping-out pull, a PR-REPL replacement
  # pull and a legacy pull all have no openings; resolvers that do not compute the rollup leave it
  # null rather than implying "nothing staged".
  staging_status: PullStatus
  staged_opening_count: Int
  total_opening_count: Int
  # When the pick was confirmed and by whom (#367). This is the moment stock left inventory;
  # approved_at only says the warehouse started on the pull. Staging and completion gate on this.
  picked_at: DateTime
  picked_by: String
  # Stock has come off the shelf for this pull but it is not fully picked - a short confirm waiting
  # on a second one. Only computed for un-picked pulls; null means "not evaluated".
  partially_picked: Boolean
  items: [PullRequestItem!]!
}

type PullRequestItem {
  id: ID!
  pull_request_id: ID!
  item_type: PullRequestItemType!
  opening_number: String!
  opening_item_id: ID
  # Deficient ShopAssemblyOpeningItem this line replaces (#339). Set only on PR-REPL replacement
  # lines minted at assembly completion; null on every other line.
  sa_opening_item_id: ID
  # Door leaf this pull line is for (#311). Null = legacy / leaf-agnostic.
  leaf: Int
  hardware_category: String
  product_code: String
  requested_quantity: Int!
  # Fetch check-off on an OPENING_ITEM line (#367): the assembled leaf has been collected off the
  # rack. Always null on a LOOSE line, which is picked by quantity instead.
  fetched_at: DateTime
  fetched_by: String
}

# --- The pick (#367) ---------------------------------------------------------------------------
# Approving a pull no longer deducts anything. The warehouse user dictates a quantity per location
# against a printable sheet, and confirming that is what moves stock. Note what is NOT in any of
# these types: a suggested quantity or a suggested split. A system suggestion is a default in
# everything but name, and the whole point of #367 is that the person at the rack decides.

type PickSheetLeaf {
  opening_number: String!
  leaf: Int
  quantity: Int!
}

type PickSheetLocation {
  inventory_location_id: ID!
  warehouse_id: ID
  warehouse_code: String
  aisle: String
  row: String
  bay: String
  # On-hand minus condemned: the ceiling confirmPick enforces for this row.
  available: Int!
  # Here so the picker can rotate stock themselves, which is the only thing FIFO was ever for.
  received_at: DateTime!
  draft_quantity: Int!
  applied_quantity: Int!
}

type PickSheetSection {
  hardware_category: String!
  product_code: String!
  required_quantity: Int!
  applied_quantity: Int!
  remaining_quantity: Int!
  # What this pull may actually take: on-hand minus condemned minus OTHER requests' claims. The
  # third ceiling confirmPick enforces, surfaced so contention shows on the screen and the printed
  # sheet rather than as a refusal after the picker has walked the racks.
  claimable_quantity: Int!
  claimable_shortfall: Int!
  # Every leaf, never truncated: the picker builds carts per leaf, so the list is the work.
  leaves: [PickSheetLeaf!]!
  locations: [PickSheetLocation!]!
}

type PickSheetFetchItem {
  pull_request_item_id: ID!
  opening_item_id: ID
  opening_number: String!
  leaf: Int
  aisle: String
  row: String
  bay: String
  state: OpeningItemState
  fetched_at: DateTime
  fetched_by: String
}

type PickSheet {
  pull_request: PullRequest!
  sections: [PickSheetSection!]!
  fetch_items: [PickSheetFetchItem!]!
}

input PickLineInput {
  # The combo is carried alongside the location id so the server can check the two agree; a client
  # that has drifted from the sheet is refused rather than deducting the wrong bin.
  hardware_category: String!
  product_code: String!
  inventory_location_id: ID!
  quantity: Int!
}

# Replaces ApproveOutcome, whose values described a moment that no longer exists. The mapping is not
# one-to-one: INSUFFICIENT meant "nothing happened, the pull is blocked and still PENDING", SHORT
# means "some of it happened, the pull is In Progress and holds real deducted stock".
enum PickOutcome {
  PICKED
  SHORT
}

type ConfirmPickResult {
  pull_request: PullRequest!
  outcome: PickOutcome!
  notification: Notification
  # Populated when outcome is SHORT: what each combo is still owed. Empty on PICKED.
  shortfalls: [InventoryShortfall!]!
  # Units this confirmation took off the shelf. Zero on a pure fetch pull.
  applied_quantity: Int!
}

input StagePullOpeningsInput {
  pull_request_id: ID!
  opening_ids: [ID!]!
  staged_by: String!
}

type StagePullOpeningsResult {
  pull_request: PullRequest!
  openings: [ShopAssemblyOpening!]!
  # Ids staged by *this* call - an opening already staged is skipped, not refused, so this is how a
  # caller tells a real confirmation from a replayed one.
  newly_staged_opening_ids: [ID!]!
  completed: Boolean!
}

input CancelPullRequestInput {
  id: ID!
  cancelled_by: String!
  reason: String
}

type RestockedLine {
  hardware_category: String!
  product_code: String!
  quantity: Int!
}

type CancelPullRequestResult {
  pull_request: PullRequest!
  # The inverse inventory write, per combo. Empty for a pull with no LOOSE lines.
  restocked: [RestockedLine!]!
  released_opening_ids: [ID!]!
  # False for a PR-REPL replacement pull or a legacy pull, which have no source request at all.
  source_request_returned_to_pending: Boolean!
  # False when the request holds no claim - no source request, or the availability re-check came up
  # short, in which case integrity_note says so and the request carries the same message.
  reservations_recreated: Boolean!
  integrity_note: String
}

type InventoryShortfall {
  hardware_category: String!
  product_code: String!
  requested: Int!
  # available = on-hand - deficient - OTHER requests' reservations (#342), so a zero here can mean
  # "the stock is present but claimed". `reserved` is that number, separately.
  available: Int!
  short: Int!
  reserved: Int!
}

# What one product in a project can still be CLAIMED for (#342): available = on_hand - deficient -
# reserved. Distinct from InventoryHierarchyNode's availability (on-hand minus deficient), which
# answers "what is physically unspoken-for in the building".
type InventoryAvailability {
  hardware_category: String!
  product_code: String!
  on_hand_quantity: Int!
  deficient_quantity: Int!
  reserved_quantity: Int!
  available_quantity: Int!
}

type ShipReadyItems {
  opening_items: [OpeningItem!]!
  loose_items: [ShipReadyLooseItem!]!
}

type ShipReadyLooseItem {
  opening_number: String!
  hardware_category: String!
  product_code: String!
  available_quantity: Int!
}

type PackingSlip {
  id: ID!
  packing_slip_number: String!
  project_id: ID!
  shipped_by: String!
  shipped_at: DateTime!
  created_at: DateTime!
  items: [PackingSlipItem!]!
}

type PackingSlipItem {
  id: ID!
  packing_slip_id: ID!
  item_type: PullRequestItemType!
  opening_item_id: ID
  opening_number: String
  # Door leaf (#335), snapshotted from the shipped OpeningItem. Null on a LOOSE line.
  leaf: Int
  product_code: String!
  hardware_category: String!
  quantity: Int!
}

enum ReturnDisposition {
  RETURN_TO_PROJECT
  NON_STOCK
  RMA_DEFECTIVE
}

type ReturnableLine {
  packing_slip_item_id: ID!
  opening_number: String
  product_code: String!
  hardware_category: String!
  shipped_quantity: Int!
  returned_quantity: Int!
  returnable_quantity: Int!
}

type ShipmentReturnItem {
  id: ID!
  shipment_return_id: ID!
  packing_slip_item_id: ID!
  disposition: ReturnDisposition!
  quantity: Int!
  hardware_category: String!
  product_code: String!
  opening_number: String
  rma_reference: String
  reason_text: String
  resulting_inventory_location_id: ID
  resulting_stock_item_id: ID
  created_at: DateTime!
}

type ShipmentReturn {
  id: ID!
  packing_slip_id: ID!
  warehouse_id: ID!
  returned_by: String!
  returned_at: DateTime!
  reference: String
  created_at: DateTime!
  items: [ShipmentReturnItem!]!
}

type Notification {
  id: ID!
  project_id: ID!
  # An audience tag, not access control: the bell queries with no recipient filter, so everyone sees
  # everything and this says who a signal is *for*. Named audiences (PO, SHIPPING,
  # SHOP_ASSEMBLY_MANAGER, WAREHOUSE) plus, for REPLACEMENT_ARRIVED, one assembler's Clerk user id.
  recipient_role: String!
  type: NotificationType!
  message: String!
  is_read: Boolean!
  created_at: DateTime!
}

# Written by every signal in the system. The three added in #344 close gaps slices 1-5 left:
enum NotificationType {
  PULL_REQUEST_CANCELLED
  PULL_REQUEST_COMPLETED
  SHIPMENT_COMPLETED
  # PO backfill signal from the inventory-sufficiency gates (#224).
  INVENTORY_SHORTFALL
  # A PR-REPL pull completed for a leaf that had already shipped (#341) -> SHIPPING.
  REPLACEMENT_AFTER_SHIPMENT
  # Openings became workable: the warehouse staged carts, or completed a pull that still had
  # un-staged openings (#344) -> SHOP_ASSEMBLY_MANAGER. One per staging confirmation, never per
  # opening, and silent when nothing actually became workable.
  ASSEMBLY_WORK_AVAILABLE
  # A replacement arrived for a leaf that has NOT shipped (#344) -> the assembler holding it.
  REPLACEMENT_ARRIVED
  # A blocked PR-REPL pull became coverable because a receive landed the stock it wanted (#344) ->
  # WAREHOUSE. Deduped to one *unread* notification per pull; see notification_service.
  PULL_UNBLOCKED
}

# received_by is NOT an input (#199): the backend stamps the Clerk-authenticated caller's display
# name, so a receive records the person and not the relay's Windows account.
input CreateReceiveInput {
  po_id: ID!
  warehouse_id: ID = null
  # Defaulted, not required: an empty receive is a legal (if pointless) call, and the resolver -
  # not the schema - is what refuses one with a typed error naming the reason.
  line_items: [ReceiveLineItemInput!]! = []
  # Short-circuits a retried receive against the same GP receipt (services/gp_idempotency.py).
  idempotency_key: String! = ""
}

input ReceiveLineItemInput {
  po_line_item_id: ID!
  quantity_received: Int!
  locations: [LocationInput!]!
}

input LocationInput {
  aisle: String!
  row: String!
  bay: String!
  quantity: Int!
  # Units of this location's quantity arriving already damaged; 0 <= deficient_quantity <= quantity.
  deficient_quantity: Int! = 0
}

input ConfirmShipmentInput {
  project_id: ID!
  packing_slip_number: String!
  shipped_by: String!
  items: [ShipmentItemInput!]!
}

input ShipmentItemInput {
  item_type: PullRequestItemType!
  opening_item_id: ID
  opening_number: String
  product_code: String
  hardware_category: String
  quantity: Int!
}

input CreateShipmentReturnInput {
  packing_slip_id: ID!
  warehouse_id: ID!
  returned_by: String!
  reference: String
  items: [ShipmentReturnItemInput!]!
}

input ShipmentReturnItemInput {
  packing_slip_item_id: ID!
  quantity: Int!
  disposition: ReturnDisposition!
  rma_reference: String
  reason_text: String
}

type RecentReceiveRecord {
  receive_record: ReceiveRecord!
  po_number: String
  total_items_received: Int!
}

type ProjectProgressByProduct {
  hardware_category: String!
  product_code: String!
  required_quantity: Int!
  po_drafted: Int!
  ordered_quantity: Int!
  received_quantity: Int!
  back_ordered: Int!
  shipped_out: Int!
}

type Query {
  openPOs(projectId: ID): [PurchaseOrder!]!
  poReceivingDetails(poId: ID!): PurchaseOrder!
  projectInventoryAvailability(projectId: ID!): [InventoryAvailability!]!
  inventoryHierarchy(projectId: ID, warehouseId: ID): [InventoryHierarchyNode!]!
  inventoryItems(projectId: ID, category: String!, productCode: String!): [InventoryItemDetail!]!
  unlocatedInventory(projectId: ID): [InventoryItemDetail!]!
  recentReceiveRecords(limit: Int! = 10): [RecentReceiveRecord!]!
  openingItems(projectId: ID): [OpeningItem!]!
  openingItemDetails(id: ID!): OpeningItemDetail!
  pullRequests(projectId: ID, source: PullRequestSource, status: PullRequestStatus): [PullRequest!]!
  pullRequestDetails(id: ID!): PullRequest!
  # The shop-assembly openings a pull covers, with their hardware lines, for the warehouse's
  # per-opening staging checklist (#343). Deliberately a separate query rather than a field on
  # PullRequest: a resolver field would run once per row of the pull-request queue, which never
  # needs it. Empty for a shipping-out / PR-REPL / legacy pull.
  pullRequestOpenings(pullRequestId: ID!): [ShopAssemblyOpening!]!
  # Everything the pick screen and the printed sheet render from (#367). A separate query for the
  # same reason as pullRequestOpenings: only the pick page needs it, never the queue.
  pullPickSheet(pullRequestId: ID!): PickSheet!
  shipReadyItems(projectId: ID): ShipReadyItems!
  projectProgressByProduct(projectId: ID!): [ProjectProgressByProduct!]!
  packingSlips(projectId: ID): [PackingSlip!]!
  returnableLines(packingSlipId: ID!): [ReturnableLine!]!
  # recipientRole defaults to "" and that default is load-bearing: empty means "every audience",
  # which is what the bell asks for. Passing a role narrows to that audience.
  notifications(projectId: ID = null, recipientRole: String! = "", unreadOnly: Boolean = null, limit: Int! = 5): [Notification!]!
}

type Mutation {
  createReceive(input: CreateReceiveInput!): ReceiveRecord!
  # Issue #427: the actor on every audit and history row is the Clerk-authenticated caller
  # (current_user -> resolve_display_name), never an argument. The startedBy / enteredBy / pickedBy /
  # fetchedBy / completedBy arguments below are accepted and IGNORED, and are nullable so they can
  # carry @deprecated; they exist only so a frontend from the previous deploy still validates, and
  # are dropped once none reference them.
  # Claim a pending pull and open it for picking (#367). Nothing moves in inventory - this is what
  # approvePullRequest was, minus everything that touched stock. The pull is assigned to the caller.
  startPullRequestPick(id: ID!, startedBy: String @deprecated(reason: "ignored; actor is the caller")): PullRequest!
  # Save the half-keyed pick sheet (#367). Replace-all, not merge: the paper is the authority.
  # Shape is validated, availability deliberately is not - a draft is a note, not a claim.
  savePickDraft(pullRequestId: ID!, lines: [PickLineInput!]!, enteredBy: String @deprecated(reason: "ignored; actor is the caller")): PickSheet!
  # Deduct exactly the rows the picker dictated and consume the claim behind them (#367). Three hard
  # ceilings: the row's available units, what the pull asked for, and what is free once other
  # requests' reservations are counted (CONFLICT when that one is hit, so #342 holds). A
  # confirmation that does not cover everything returns SHORT and is resumable.
  confirmPick(pullRequestId: ID!, lines: [PickLineInput!]!, pickedBy: String @deprecated(reason: "ignored; actor is the caller")): ConfirmPickResult!
  # Tick (or untick) one assembled leaf off a shipping pull's fetch list (#367). Nothing moves in
  # inventory - the leaf's hardware left it at assembly.
  setPullItemFetched(itemId: ID!, fetched: Boolean!, fetchedBy: String @deprecated(reason: "ignored; actor is the caller")): PullRequestItem!
  # Close the whole pull. Since #343 this reads as "stage everything still outstanding and finish":
  # any opening not yet confirmed individually is flipped to PULLED and stamped with the caller.
  # Refused until the pick is confirmed (#367).
  completePullRequest(id: ID!, completedBy: String @deprecated(reason: "ignored; actor is the caller")): PullRequest!
  # Confirm that the carts for these openings of a picked shop-assembly pull are built (#343).
  # Each one becomes assignable and workable immediately; staging the last completes the pull.
  # Nothing moves in inventory - the deduction and the source request's reservation were both spent
  # at the pick confirmation. Already-staged openings are skipped, not refused.
  stagePullOpenings(input: StagePullOpeningsInput!): StagePullOpeningsResult!
  # Cancel a started pull, return its hardware to inventory, and hand the source request back to
  # PENDING (#343). All-or-nothing: an opening whose assembly has started or finished refuses the
  # whole cancellation with CONFLICT, naming every blocker. What comes back is what was picked
  # (#367): everything on a fully picked pull, the picked part of a short one, nothing on an
  # un-picked one.
  cancelPullRequest(input: CancelPullRequestInput!): CancelPullRequestResult!
  confirmShipment(input: ConfirmShipmentInput!): PackingSlip!
  createShipmentReturn(input: CreateShipmentReturnInput!): ShipmentReturn!
  adjustInventoryQuantity(inventoryLocationId: ID!, adjustment: Int!, reason: String!): InventoryLocation!
  moveInventoryLocation(inventoryLocationId: ID!, newAisle: String!, newRow: String!, newBay: String!): InventoryLocation!
  markInventoryUnlocated(inventoryLocationId: ID!): InventoryLocation!
  assignInventoryLocation(inventoryLocationId: ID!, aisle: String!, row: String!, bay: String!): InventoryLocation!
  moveOpeningItemLocation(openingItemId: ID!, aisle: String!, row: String!, bay: String!, warehouseId: ID): OpeningItem!
  markOpeningItemUnlocated(openingItemId: ID!): OpeningItem!
  assignOpeningItemLocation(openingItemId: ID!, aisle: String!, row: String!, bay: String!): OpeningItem!
  markNotificationAsRead(id: ID!): Notification!
}

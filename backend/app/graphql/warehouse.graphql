type ShipmentReturn {
  id: ID!
  packing_slip_id: ID!
  warehouse_id: ID!
  returned_by: String!
  returned_at: DateTime!
  reference: String
  created_at: DateTime!
  items: [ShipmentReturnItem!]!
}

type Notification {
  id: ID!
  project_id: ID!
  recipient_role: String!
  type: NotificationType!
  message: String!
  is_read: Boolean!
  created_at: DateTime!
}

input CreateReceiveInput {
  po_id: ID!
  received_by: String!
  line_items: [ReceiveLineItemInput!]!
}

input ReceiveLineItemInput {
  po_line_item_id: ID!
  quantity_received: Int!
  locations: [LocationInput!]!
}

input LocationInput {
  aisle: String!
  row: String!
  bay: String!
  quantity: Int!
}

input ConfirmShipmentInput {
  project_id: ID!
  packing_slip_number: String!
  shipped_by: String!
  items: [ShipmentItemInput!]!
}

input ShipmentItemInput {

# Shipping Module SDL Reference
# Source of truth: Strawberry resolvers in app/schemas/shipping.py

# --- Shipping-out request (accept gate, #293) ---
# Start-a-Task mints a PENDING ShippingOutRequest; a signed-in user accepts it, which mints the
# warehouse PullRequest (SHIPPING_OUT, PENDING) from the request's items and stamps pullRequestId.

enum ShippingOutRequestStatus {
  PENDING
  APPROVED
  REJECTED
}

type ShippingOutRequestItem {
  id: ID!
  shippingOutRequestId: ID!
  itemType: PullRequestItemType!
  openingNumber: String!
  openingItemId: ID
  # Door leaf (#335): set on OPENING_ITEM lines from the assembled OpeningItem, null on LOOSE.
  leaf: Int
  hardwareCategory: String
  productCode: String
  requestedQuantity: Int!
}

type ShippingOutRequest {
  id: ID!
  requestNumber: String!
  projectId: ID!
  status: ShippingOutRequestStatus!
  createdBy: String!
  approvedBy: String
  rejectedBy: String
  rejectionReason: String
  createdAt: DateTime!
  approvedAt: DateTime
  rejectedAt: DateTime
  # See ShopAssemblyRequest.integrity_note (#342).
  integrityNote: String
  pullRequestId: ID
  items: [ShippingOutRequestItem!]!
}

# --- Delivery Request (#447) ---
# A shipment is the paper form the shipping department fills in and the site signs off on, plus a
# lifecycle for the truck's journey. No inventory moves between the states - confirmShipment is still
# what claims the hardware. The header is editable only while SCHEDULED, because once the shipment is
# picked up a driver is carrying a printed copy the record has to keep matching.

enum ShipmentStatus {
  SCHEDULED
  PICKED_UP
  DELIVERED
}

type PackingSlip {
  id: ID!
  packingSlipNumber: String!
  projectId: ID!
  status: ShipmentStatus!
  shippedBy: String!
  shippedAt: DateTime!
  createdAt: DateTime!
  # The Delivery Request header. Every field is nullable: a blank on the paper form is a real
  # answer, and slips confirmed before #447 have nothing to backfill from.
  pickupDate: Date
  deliveryDate: Date
  shipperEmail: String
  shipperPhone: String
  # Snapshot of the warehouse address, not a reference - the warehouse record can be edited or
  # retired long after the truck left, and the form has to keep printing where it was sent.
  pickupLocation: String
  carrierTagBol: String
  weightLbs: Float
  deliveryAddress: String
  specialInstructions: String
  # The site questions, free text: the answers that come back are "yes until 3pm" and "gate 4, ask
  # for Dave", which a checkbox would lose the useful half of.
  gateNumber: String
  forkliftOnsite: String
  materialComingBack: String
  siteMaterialIncluded: String
  constructionTempKeys: String
  extraFrameAnchors: String
  contractorContactName: String
  contractorContactPhone: String
  ucshContactName: String
  ucshContactPhone: String
  salesOrderNumber: String
  pickedUpAt: DateTime
  pickedUpBy: String
  deliveredAt: DateTime
  deliveredBy: String
  items: [PackingSlipItem!]!
}

# --- The Delivery Request header, once (#453) ---------------------------------------------------
# Both inputs below carry EVERY field in this block, all optional. It is a shared Strawberry base
# (DeliveryRequestHeaderInput in app/schemas/inputs.py) whose fields are flattened into each
# subclass, so the real schema shows them on both inputs and has no type of this name.
#
#   pickupDate: Date
#   deliveryDate: Date
#   shipperEmail: String
#   shipperPhone: String
#   pickupLocation: String
#   carrierTagBol: String
#   weightLbs: Float
#   deliveryAddress: String
#   specialInstructions: String
#   gateNumber: String
#   forkliftOnsite: String
#   materialComingBack: String
#   siteMaterialIncluded: String
#   constructionTempKeys: String
#   extraFrameAnchors: String
#   contractorContactName: String
#   contractorContactPhone: String
#   ucshContactName: String
#   ucshContactPhone: String
#   salesOrderNumber: String

input ConfirmShipmentInput {
  projectId: ID!
  packingSlipNumber: String!
  items: [ShipmentItemInput!]!
  # + every field of the Delivery Request header block above.
}

input UpdateShipmentDetailsInput {
  id: ID!
  # + every field of the Delivery Request header block above. Full replace: each is applied as given
  # and null CLEARS. The client sends all of them on every edit, blanks as explicit nulls, or a field
  # could never be emptied once filled.
}

# --- Ship-ready / packing slips / returns (existing) ---

type ShipReadyItems {
  openingItems: [OpeningItem!]!
  looseItems: [ShipReadyLooseItem!]!
}

type ShipReadyLooseItem {
  openingNumber: String!
  hardwareCategory: String!
  productCode: String!
  availableQuantity: Int!
}

# --- Coverage for the shipping-out builder (#451) ---
# What the openings the user just picked still owe the site, leaf by leaf. Three sources the
# builder could not join on its own: the schedule (owed), the assembled leaf (installed), and the
# open purchase orders (on order).
#
# Availability is NOT here. projectInventoryAvailability is the single answer to "what may I claim"
# (#342) and the creation gate is applied against it; the builder joins the two by
# (hardwareCategory, productCode) rather than reading a second figure that could disagree.

type ShippingCoverageLine {
  hardwareCategory: String!
  productCode: String!
  # Null = never classified. Grouped as "unclassified" rather than guessed at.
  classification: Classification
  owedQuantity: Int!
  # Bolted onto the assembled leaf. Always 0 for site hardware and for an unassembled leaf.
  installedQuantity: Int!
  # owed - installed: what still travels loose. For shop hardware, exactly what assembly skipped.
  suggestedQuantity: Int!
  # Placed with a vendor, not yet received, project-wide. Not an allocation to this leaf.
  onOrderQuantity: Int!
}

type ShippingCoverageLeaf {
  openingNumber: String!
  # Null only for a legacy opening no leaf data resolves anywhere.
  leaf: Int
  status: LeafStatus!
  openingItemId: ID
  # Set when a live shipping-out request already holds this leaf - it cannot go on a second one.
  claimedByRequestNumber: String
  lines: [ShippingCoverageLine!]!
}

type ReturnableLine {
  packingSlipItemId: ID!
  openingNumber: String
  productCode: String!
  hardwareCategory: String!
  shippedQuantity: Int!
  returnedQuantity: Int!
  returnableQuantity: Int!
}

type Query {
  shipReadyItems(projectId: ID): ShipReadyItems!
  packingSlips(projectId: ID): [PackingSlip!]!
  returnableLines(packingSlipId: ID!): [ReturnableLine!]!
  # Shipping-out builder coverage (#451): one row per door leaf of the given openings.
  shippingCoverage(projectId: ID!, openingNumbers: [String!]!): [ShippingCoverageLeaf!]!
  # Accept UI (#293): shipping-out requests, PENDING by default.
  # reopenableOnly (#325): keep only requests whose minted PR is still PENDING (the Approved/reopen view).
  shippingOutRequests(projectId: ID, status: ShippingOutRequestStatus, reopenableOnly: Boolean! = false): [ShippingOutRequest!]!
}

type Mutation {
  confirmShipment(input: ConfirmShipmentInput!): PackingSlip!
  createShipmentReturn(input: CreateShipmentReturnInput!): ShipmentReturn!
  # Delivery Request lifecycle (#447). Any signed-in user. All three answer with the same PackingSlip
  # the list reads, so Apollo's normalised cache updates the row in place.
  # updateShipmentDetails is refused unless the shipment is still SCHEDULED; markShipmentDelivered
  # only from PICKED_UP. The actor stamped on each leg is the Clerk-authenticated caller (#427).
  updateShipmentDetails(input: UpdateShipmentDetailsInput!): PackingSlip!
  markShipmentPickedUp(id: ID!): PackingSlip!
  markShipmentDelivered(id: ID!): PackingSlip!
  # Accept gate (#293). Any signed-in user. Accept mints the warehouse PullRequest;
  # the warehouse approve handles shortfalls. The approval is recorded against the
  # Clerk-authenticated caller (#427). The acceptedBy/rejectedBy arguments lingered as ignored
  # @deprecated no-ops for one deploy so stale tabs still validated, and came out in #438.
  acceptShippingOutRequest(id: ID!): ShippingOutRequest!
  rejectShippingOutRequest(id: ID!, reason: String): ShippingOutRequest!
  # Reopen (#325). Undoes an erroneous accept: APPROVED -> PENDING, hard-deletes the minted
  # PullRequest. Refused if the warehouse has already worked the pull.
  reopenShippingOutRequest(id: ID!): ShippingOutRequest!
}

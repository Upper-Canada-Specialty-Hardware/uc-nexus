# Shipping Module SDL Reference
# Source of truth: Strawberry resolvers in app/schemas/shipping.py

# --- Shipping-out request (accept gate, #293) ---
# Start-a-Task mints a PENDING ShippingOutRequest; a signed-in user accepts it, which mints the
# warehouse PullRequest (SHIPPING_OUT, PENDING) from the request's items and stamps pullRequestId.

enum ShippingOutRequestStatus {
  PENDING
  APPROVED
  REJECTED
}

type ShippingOutRequestItem {
  id: ID!
  shippingOutRequestId: ID!
  itemType: PullRequestItemType!
  # Null on a line raised straight off project inventory (#451): shelf stock belongs to the project,
  # not to a door, so there is nothing to attribute. Schedule-driven lines keep their opening.
  openingNumber: String
  openingItemId: ID
  # Door leaf (#335): set on OPENING_ITEM lines from the assembled OpeningItem, null on LOOSE.
  leaf: Int
  hardwareCategory: String
  productCode: String
  requestedQuantity: Int!
}

type ShippingOutRequest {
  id: ID!
  requestNumber: String!
  projectId: ID!
  status: ShippingOutRequestStatus!
  createdBy: String!
  approvedBy: String
  rejectedBy: String
  rejectionReason: String
  createdAt: DateTime!
  approvedAt: DateTime
  rejectedAt: DateTime
  # See ShopAssemblyRequest.integrity_note (#342).
  integrityNote: String
  pullRequestId: ID
  items: [ShippingOutRequestItem!]!
}

# --- Delivery Request (#447) ---
# A shipment is the paper form the shipping department fills in and the site signs off on, plus a
# lifecycle for the truck's journey. No inventory moves between the states - confirmShipment is still
# what claims the hardware. The header is editable only while SCHEDULED, because once the shipment is
# picked up a driver is carrying a printed copy the record has to keep matching.

enum ShipmentStatus {
  SCHEDULED
  PICKED_UP
  DELIVERED
}

type PackingSlip {
  id: ID!
  packingSlipNumber: String!
  projectId: ID!
  status: ShipmentStatus!
  shippedBy: String!
  shippedAt: DateTime!
  createdAt: DateTime!
  # The Delivery Request header. Every field is nullable: a blank on the paper form is a real
  # answer, and slips confirmed before #447 have nothing to backfill from.
  pickupDate: Date
  deliveryDate: Date
  shipperEmail: String
  shipperPhone: String
  # Snapshot of the warehouse address, not a reference - the warehouse record can be edited or
  # retired long after the truck left, and the form has to keep printing where it was sent.
  pickupLocation: String
  # How the load travelled (#451): a snapshot of the ShipmentMethod name, not a reference, so a
  # renamed or retired method cannot rewrite what an already-shipped slip says.
  shipmentMethod: String
  carrierTagBol: String
  weightLbs: Float
  deliveryAddress: String
  specialInstructions: String
  # The site questions, free text: the answers that come back are "yes until 3pm" and "gate 4, ask
  # for Dave", which a checkbox would lose the useful half of.
  gateNumber: String
  forkliftOnsite: String
  materialComingBack: String
  siteMaterialIncluded: String
  constructionTempKeys: String
  extraFrameAnchors: String
  contractorContactName: String
  contractorContactPhone: String
  ucshContactName: String
  ucshContactPhone: String
  salesOrderNumber: String
  pickedUpAt: DateTime
  pickedUpBy: String
  deliveredAt: DateTime
  deliveredBy: String
  items: [PackingSlipItem!]!
}

# --- The Delivery Request header, once (#453) ---------------------------------------------------
# Both inputs below carry EVERY field in this block, all optional. It is a shared Strawberry base
# (DeliveryRequestHeaderInput in app/schemas/inputs.py) whose fields are flattened into each
# subclass, so the real schema shows them on both inputs and has no type of this name.
#
#   pickupDate: Date
#   deliveryDate: Date
#   shipperEmail: String
#   shipperPhone: String
#   pickupLocation: String
#   shipmentMethod: String
#   carrierTagBol: String
#   weightLbs: Float
#   deliveryAddress: String
#   specialInstructions: String
#   gateNumber: String
#   forkliftOnsite: String
#   materialComingBack: String
#   siteMaterialIncluded: String
#   constructionTempKeys: String
#   extraFrameAnchors: String
#   contractorContactName: String
#   contractorContactPhone: String
#   ucshContactName: String
#   ucshContactPhone: String
#   salesOrderNumber: String

input ConfirmShipmentInput {
  projectId: ID!
  packingSlipNumber: String!
  items: [ShipmentItemInput!]!
  # + every field of the Delivery Request header block above.
}

input UpdateShipmentDetailsInput {
  id: ID!
  # + every field of the Delivery Request header block above. Full replace: each is applied as given
  # and null CLEARS. The client sends all of them on every edit, blanks as explicit nulls, or a field
  # could never be emptied once filled.
}

# --- Ship-ready / packing slips / returns (existing) ---

type ShipReadyItems {
  openingItems: [OpeningItem!]!
  looseItems: [ShipReadyLooseItem!]!
}

type ShipReadyLooseItem {
  # Null for stock pulled by a request raised off inventory (#451). Sorted last, as its own group.
  openingNumber: String
  hardwareCategory: String!
  productCode: String!
  availableQuantity: Int!
}

# --- Coverage for the shipping-out builder (#451) ---
# What the openings the user just picked still owe the site, leaf by leaf. Three sources the
# builder could not join on its own: the schedule (owed), the assembled leaf (installed), and the
# open purchase orders (on order).
#
# Availability is NOT here. projectInventoryAvailability is the single answer to "what may I claim"
# (#342) and the creation gate is applied against it; the builder joins the two by
# (hardwareCategory, productCode) rather than reading a second figure that could disagree.

type ShippingCoverageLine {
  hardwareCategory: String!
  productCode: String!
  # Null = never classified. Grouped as "unclassified" rather than guessed at.
  classification: Classification
  owedQuantity: Int!
  # Bolted onto the assembled leaf. Always 0 for site hardware and for an unassembled leaf.
  installedQuantity: Int!
  # Already sent, or on its way out: shipped slips, staged pulls, lines on live requests. The
  # schedule does not shrink when hardware goes out, so without this a shipped leaf is re-offered.
  spokenForQuantity: Int!
  # owed - installed - spoken for: what still travels loose. For shop hardware, what assembly
  # skipped and nobody has sent since.
  suggestedQuantity: Int!
  # Placed with a vendor, not yet received, project-wide. Not an allocation to this leaf.
  onOrderQuantity: Int!
}

type ShippingCoverageLeaf {
  openingNumber: String!
  # Null only for a legacy opening no leaf data resolves anywhere.
  leaf: Int
  status: LeafStatus!
  openingItemId: ID
  # Set when a live shipping-out request already holds this leaf - it cannot go on a second one.
  claimedByRequestNumber: String
  lines: [ShippingCoverageLine!]!
}

# --- Shipment methods (#451) ---
# The shipping department's own list of how a load can travel. Documentation, not an entity anything
# downstream reasons about - nothing joins to it and the slip keeps a string copy of the name.

type ShipmentMethod {
  id: ID!
  name: String!
  # Retiring is isActive=false, never a delete: the form offers only active methods while shipments
  # that went out under it keep printing their own snapshot.
  isActive: Boolean!
  sortOrder: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# --- Staging workspace and containers (#451) ----------------------------------------------------
# The staging pool is everything a completed shipping pull put on the floor: assembled leaves at
# SHIP_READY, and loose quantities picked but not yet shipped. Containers are how that pool gets
# arranged into what physically goes on the truck, built up over hours or days and then confirmed as
# one shipment. Nothing here moves inventory - the hardware left when its pull was picked (#367).
#
# A container is open while packingSlipId is null and shipped once it is stamped. There is no status
# column: the slip IS the lifecycle, so a container cannot read as shipped without one.

enum ShipmentContainerType {
  SKID
  DOOR_CART
  BOX
  ENVELOPE
  BUNDLE
}

type ShipmentContainerItem {
  id: ID!
  shipmentContainerId: ID!
  itemType: PullRequestItemType!
  openingItemId: ID
  # Null on loose stock pulled by a request raised off inventory (#451).
  openingNumber: String
  leaf: Int
  hardwareCategory: String!
  productCode: String!
  quantity: Int!
  # Load order. 0 is loaded first, which on a skid is the bottom of the stack. Only meaningful for
  # SKID and DOOR_CART, the two that are unloaded in reverse.
  position: Int!
}

type ShipmentContainer {
  id: ID!
  projectId: ID!
  containerType: ShipmentContainerType!
  name: String!
  # Set when this container shipped. Null means open, and open is the only thing that can be edited.
  packingSlipId: ID
  createdBy: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  items: [ShipmentContainerItem!]!
}

type StagedLeaf {
  openingItemId: ID!
  openingNumber: String!
  leaf: Int
  building: String
  floor: String
  location: String
  # The container holding it, or null if it is still loose on the floor. One leaf, one container.
  placedInContainerId: ID
}

type StagedLooseItem {
  # Part of this row's identity, not a label: get_ship_ready_items groups the staged pool by
  # (opening, category, product) and confirmShipment checks availability the same way, so a product
  # staged for two openings is two rows here.
  openingNumber: String
  hardwareCategory: String!
  productCode: String!
  stagedQuantity: Int!
  placedQuantity: Int!
  unplacedQuantity: Int!
}

type StagingPool {
  leaves: [StagedLeaf!]!
  looseItems: [StagedLooseItem!]!
  containers: [ShipmentContainer!]!
}

input ContainerItemInput {
  itemType: PullRequestItemType!
  openingItemId: ID
  # Part of a loose placement's identity, not decoration: it is what confirmShipment checks the
  # units against. Send back the openingNumber of the StagedLooseItem row the units came from.
  openingNumber: String
  leaf: Int
  hardwareCategory: String! = ""
  productCode: String! = ""
  quantity: Int! = 1
}

input SetContainerItemsInput {
  containerId: ID!
  # FULL REPLACE, and the list order IS the stacking order - position comes from the index, so the
  # caller never computes it. One batch call rather than place/remove/reorder as three, because a
  # drag-and-drop surface already holds the whole list.
  items: [ContainerItemInput!]!
}

input ConfirmShipmentFromContainersInput {
  projectId: ID!
  packingSlipNumber: String!
  containerIds: [ID!]!
  # + every field of the Delivery Request header block above.
}

type ReturnableLine {
  packingSlipItemId: ID!
  openingNumber: String
  productCode: String!
  hardwareCategory: String!
  shippedQuantity: Int!
  returnedQuantity: Int!
  returnableQuantity: Int!
}

type Query {
  shipReadyItems(projectId: ID): ShipReadyItems!
  packingSlips(projectId: ID): [PackingSlip!]!
  returnableLines(packingSlipId: ID!): [ReturnableLine!]!
  # Shipping-out builder coverage (#451): one row per door leaf of the given openings.
  shippingCoverage(projectId: ID!, openingNumbers: [String!]!): [ShippingCoverageLeaf!]!
  # activeOnly is what the Delivery Request form passes; the management screen leaves it off so a
  # retired method stays visible to reactivate.
  shipmentMethods(activeOnly: Boolean! = false): [ShipmentMethod!]!
  # The staging workspace's whole read (#451): what is on the floor and where it has been put. One
  # query rather than two, because two could disagree about whether a leaf has been loaded and that
  # disagreement is the mistake containers exist to prevent.
  stagingPool(projectId: ID!): StagingPool!
  # Accept UI (#293): shipping-out requests, PENDING by default.
  # reopenableOnly (#325): keep only requests whose minted PR is still PENDING (the Approved/reopen view).
  shippingOutRequests(projectId: ID, status: ShippingOutRequestStatus, reopenableOnly: Boolean! = false): [ShippingOutRequest!]!
}

# --- Raising and correcting a request from the Shipping module (#451) ---------------------------
# The schedule is not the only reason hardware goes to site. These two compose the same entity
# Start a Task mints, under the same guards and the same reservations - only the composer differs.

input ShippingOutPRDraftItemInput {
  itemType: PullRequestItemType!
  # Optional: a LOOSE line raised off inventory has no opening to name.
  openingNumber: String
  openingItemId: ID
  leaf: Int
  hardwareCategory: String
  productCode: String
  requestedQuantity: Int! = 1
}

input CreateShippingOutRequestInput {
  projectId: ID!
  requestNumber: String!
  items: [ShippingOutPRDraftItemInput!]!
  # The caller has seen the "this leaf is short" warning and wants it on the request anyway (#341).
  acknowledgeIncompleteLeaves: Boolean! = false
}

input EditShippingOutRequestInput {
  id: ID!
  # FULL REPLACE. The request ends up with exactly these lines. Emptying it is refused - reject it.
  items: [ShippingOutPRDraftItemInput!]!
  acknowledgeIncompleteLeaves: Boolean! = false
}

type Mutation {
  # Raise a request off project inventory (#451), no wizard. PENDING, reserving what its loose
  # lines claim, exactly as the Start-a-Task path does.
  createShippingOutRequest(input: CreateShippingOutRequestInput!): ShippingOutRequest!
  # Correct a PENDING request before anyone accepts it (#451). Refused once accepted: the lines are
  # on a warehouse pull by then and the floor may be picking against a printed sheet. Re-gated
  # against availability with the request's own claim released first, so reducing a line is never
  # refused for stock it already holds.
  editShippingOutRequest(input: EditShippingOutRequestInput!): ShippingOutRequest!
  # Shipment method list management (#451). A rename never touches shipments already sent under the
  # old name; delete is safe for the same reason - no shipment references the row.
  createShipmentMethod(name: String!, sortOrder: Int! = 0): ShipmentMethod!
  updateShipmentMethod(id: ID!, name: String, isActive: Boolean, sortOrder: Int): ShipmentMethod!
  deleteShipmentMethod(id: ID!): Boolean!
  # Containers (#451). All four refuse a container that has already shipped - it is part of that
  # shipment's record. Delete returns the container's contents to the unplaced pool.
  createShipmentContainer(projectId: ID!, containerType: ShipmentContainerType!, name: String!): ShipmentContainer!
  renameShipmentContainer(id: ID!, name: String!): ShipmentContainer!
  deleteShipmentContainer(id: ID!): Boolean!
  # Re-gated inside the write transaction against the pool as it is at save time, not as it was when
  # the screen was drawn: a skid's leaf cap, one leaf per open container, and loose placements
  # against what is staged and unplaced.
  setContainerItems(input: SetContainerItemsInput!): ShipmentContainer!
  # Ship the named containers as one shipment, then stamp the slip onto each so they read as shipped.
  # A thin wrapper over confirmShipment, which still owns every rule about what may leave.
  confirmShipmentFromContainers(input: ConfirmShipmentFromContainersInput!): PackingSlip!
  confirmShipment(input: ConfirmShipmentInput!): PackingSlip!
  createShipmentReturn(input: CreateShipmentReturnInput!): ShipmentReturn!
  # Delivery Request lifecycle (#447). Any signed-in user. All three answer with the same PackingSlip
  # the list reads, so Apollo's normalised cache updates the row in place.
  # updateShipmentDetails is refused unless the shipment is still SCHEDULED; markShipmentDelivered
  # only from PICKED_UP. The actor stamped on each leg is the Clerk-authenticated caller (#427).
  updateShipmentDetails(input: UpdateShipmentDetailsInput!): PackingSlip!
  markShipmentPickedUp(id: ID!): PackingSlip!
  markShipmentDelivered(id: ID!): PackingSlip!
  # Accept gate (#293). Any signed-in user. Accept mints the warehouse PullRequest;
  # the warehouse approve handles shortfalls. The approval is recorded against the
  # Clerk-authenticated caller (#427). The acceptedBy/rejectedBy arguments lingered as ignored
  # @deprecated no-ops for one deploy so stale tabs still validated, and came out in #438.
  acceptShippingOutRequest(id: ID!): ShippingOutRequest!
  rejectShippingOutRequest(id: ID!, reason: String): ShippingOutRequest!
  # Reopen (#325). Undoes an erroneous accept: APPROVED -> PENDING, hard-deletes the minted
  # PullRequest. Refused if the warehouse has already worked the pull.
  reopenShippingOutRequest(id: ID!): ShippingOutRequest!
}

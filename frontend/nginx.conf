server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress the bundles. Every deploy invalidates the hashed assets, so each user pulls the
    # whole app again; uncompressed that is ~3-4x the transfer.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # SPA fallback. index.html (and other non-hashed root files) must never
    # be cached, otherwise stale tabs hold references to chunk filenames
    # that no longer exist after a redeploy.
    #
    # Security headers are repeated in every location: a location that sets any add_header
    # drops the server-level ones.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

name: preview-env-cleanup

# Deletes the PR's Railway environment when the PR closes. Railway tears down environments IT created,
# and preview-env forks every one itself, so nothing else would ever delete these. Deleting an
# already-gone environment is a no-op here, so this runs for every close, merge included.
#
# A preview-env run still going when the PR closes is left to finish first. Cancelling it would leave
# a red "cancelled" run on the closed PR, and deleting the environment under it would have Railway
# mark every in-flight deployment "Deployment cancelled" on the head sha - two failures on a PR that
# failed nothing. So this workflow keeps its own concurrency group, waits for the build to end, and
# only then deletes. The environment lives a few extra minutes after a merge; nothing reads it.

on:
  pull_request:
    types: [closed]

# Its own group, per PR. Sharing preview-env's group would cancel the very build this waits for.
concurrency:
  group: preview-env-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    name: Delete the PR test environment
    runs-on: ubuntu-latest
    # preview-env gives itself 40 minutes; the wait below gives up at 45 and deletes anyway.
    timeout-minutes: 55
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_WORKSPACE_TOKEN }}
      RAILWAY_API_URL: https://backboard.railway.com/graphql/v2
      PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for an in-flight build to finish
        shell: bash
        run: |
          set +e -o pipefail
          # preview-env runs on this PR's branch that have not completed: a run reads queued,
          # in_progress, waiting, requested or pending until it is completed. --repo, because nothing is
          # checked out here and gh has no git remote to infer the repository from.
          build_runs() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow preview-env.yml --branch "$HEAD_REF" --event pull_request \
              --json databaseId,status --jq '[.[]|select(.status!="completed")|.databaseId]|join(" ")'
          }
          waited=0; grace=0
          while [ "$waited" -lt 2700 ]; do
            ids=$(build_runs 2>"$RUNNER_TEMP/gh.err") \
              || { echo "::warning::could not list preview-env runs ($(head -1 "$RUNNER_TEMP/gh.err")); not waiting"; exit 0; }
            if [ -z "$ids" ]; then
              # One grace pass: a push that landed just before the close can still be creating its run.
              [ "$grace" = "1" ] && { echo "no preview-env run in flight"; exit 0; }
              grace=1; sleep 30; waited=$((waited+30)); continue
            fi
            echo "preview-env run $ids still going (${waited}s); waiting for it to finish"
            sleep 20; waited=$((waited+20))
          done
          echo "::warning::a preview-env run was still going after 45 minutes; deleting the environment under it"

      - name: Delete the environment if it still exists
        shell: bash
        run: |
          set +e -o pipefail
          [ -n "$RAILWAY_TOKEN" ] || { echo "no Railway token configured; nothing to do"; exit 0; }
          [ -n "$PROJECT_ID" ] || { echo "no Railway project id configured; nothing to do"; exit 0; }
          ENV_NAME="uc-nexus-pr-${PR}"

          rgql() {
            local q="$1" v="$2" resp body
            body=$(jq -cn --arg q "$q" --argjson v "$v" '{query:$q, variables:$v}') || return 1
            resp=$(curl -sS -X POST "$RAILWAY_API_URL" \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body") || return 1
            if printf '%s' "$resp" | jq -e 'has("errors") and (.errors|length>0)' >/dev/null 2>&1; then
              printf 'Railway API error: %s\n' "$(printf '%s' "$resp" | jq -c '.errors')" >&2
              return 1
            fi
            printf '%s' "$resp" | jq -c '.data'
          }

          data=$(rgql 'query($id:String!){ environments(projectId:$id){ edges{ node{ id name } } } }'             "$(jq -cn --arg id "$PROJECT_ID" '{id:$id}')")             || { echo "::warning::could not list Railway environments"; exit 0; }
          ENV_ID=$(printf '%s' "$data" | jq -r --arg n "$ENV_NAME" '[.environments.edges[]?|select(.node.name==$n)|.node.id][0] // empty')
          if [ -z "$ENV_ID" ]; then
            echo "environment $ENV_NAME does not exist; nothing to delete"
            exit 0
          fi

          if rgql 'mutation($id:String!){ environmentDelete(id:$id) }' "$(jq -cn --arg id "$ENV_ID" '{id:$id}')" >/dev/null; then
            echo "deleted environment $ENV_NAME ($ENV_ID)"
          else
            echo "::warning::could not delete environment $ENV_NAME ($ENV_ID); it may need manual removal in the Railway dashboard"
          fi

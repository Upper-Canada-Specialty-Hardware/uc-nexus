name: preview-env

# Builds and hands off a signed-in-ready test environment for every non-draft PR.
#
# The workflow owns every build in that environment. It resolves uc-nexus-pr-<N> or forks one from
# production, repoints the forked deployment triggers at the PR branch, sets the testing variables,
# and then deploys each service for THIS PR head sha and waits on the deployment id it created. It
# reads no other Railway deployment state, so a build it did not start can neither satisfy the gate
# nor confuse it.
#
# Relay state is REPORTED, never gated on. The only relay is the workstation relay, which finds a
# preview through production's registry (app/services/preview_announce.py) and dials it over the
# socket it already holds. It can be off; a green check with a "relay: DOWN" line is correct.
#
# Railway facts this depends on, all confirmed against the public schema at
# https://backboard.railway.com/graphql/v2 (unauthenticated introspection answers there):
#   - RAILWAY_WORKSPACE_TOKEN must be a WORKSPACE token. A project token authenticates with a
#     Project-Access-Token header and sees one environment, so it can neither list siblings nor
#     deploy them.
#   - environmentCreate(sourceEnvironmentId) forks services and variables but NOT volumes: duplication
#     drops the volumeMounts/volumes stanzas outright, so the forked Postgres crash-loops on a missing
#     mount while its deployment still reads SUCCESS and the backend times out on
#     postgres.railway.internal forever. Detection is the crash-loop line in that deployment's own
#     runtime logs ("Railway volume not mounted") - config-level volume queries are unreliable because
#     volume instances only materialize on deploy. The heal is in place: volumeCreate (which looks like
#     a no-op, the volume lists empty right after) followed by one deploy.
#   - environmentDelete is asynchronous, and the environments LIST drops the row immediately while the
#     NAME stays reserved until the teardown finishes. A list poll therefore proves nothing; only
#     environmentCreate itself can tell when the name is free, so it is retried until it takes.
#   - A fork's deployment triggers keep the SOURCE environment's branch, so Railway would deploy master
#     into the preview on its next push. deploymentTriggerUpdate(id,{branch}) is per-environment -
#     DeploymentTrigger carries environmentId - so repointing them cannot reach production.
#     serviceConnect is service-level and WOULD, which is why it is not used here.
#   - environmentTriggersDeploy fires the environment's repo triggers, so it answers ok and deploys
#     NOTHING for the image-backed Postgres. serviceInstanceDeployV2(serviceId, environmentId,
#     commitSha) deploys the instance whatever its source kind and returns the new deployment id, so a
#     silent no-op cannot hide. Deployment.meta is a JSON scalar carrying commitHash, which is how a
#     build for this head sha is recognized on a re-run.
#   - deployments(input, first:100), never the status.successfulOnly filter (the API rejects that
#     shape). Railway appends a SKIPPED record per push for unchanged services, so a small window would
#     scroll this PR's own build out of view after enough pushes.
#   - DeploymentStatus has no CANCELLED. Working: BUILDING / DEPLOYING / QUEUED / WAITING /
#     INITIALIZING / NEEDS_APPROVAL. Terminal non-success: CRASHED / FAILED / REMOVED / REMOVING /
#     SKIPPED / SLEEPING.
#   - Variables apply at deploy time, so every upsert here passes skipDeploys and the deploy pass below
#     is what carries them. A service whose variables this run changed therefore cannot reuse an
#     existing deployment for the same commit - that build predates the change.
#
# One-time ops outside any PR (not created by this workflow):
#   - repo secret RAILWAY_WORKSPACE_TOKEN and repo variable RAILWAY_PROJECT_ID.
#   - a dedicated e2e Clerk user, Admin/Manager in its publicMetadata, with E2E_CLERK_USER_ID on the
#     PRODUCTION backend so every fork inherits it. The sign-in link mints that account, which
#     production refuses (app/auth._reject_e2e_account_in_production), so it is safe to sit in a
#     public PR comment.
#   - PREVIEW_CLONE_PASSWORD on the production backend (forks inherit it; production creates the
#     read-only preview_clone role from it).
#   - Railway's own PR-environments toggle is OFF: this workflow forks every environment, and
#     preview-env-cleanup.yml deletes it once the PR closes AND any run here has finished (Railway
#     only tears down environments it created itself).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One run per PR; a newer push cancels an in-flight run so two never race on the same environment,
# variable, or sticky comment. Per PR deliberately: a repo-wide group would let GitHub replace a
# PENDING run of another PR, silently dropping that PR's build. NOT shared with preview-env-cleanup:
# a close must never cancel a run here (a cancelled run is a red check on the closed PR), so cleanup
# keeps its own group and waits for this run to finish before it deletes the environment.
concurrency:
  group: preview-env-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  preview-env:
    name: Build and hand off the PR test environment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Drafts and bot PRs (dependabot) get no environment - there would be nothing to sign into.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_WORKSPACE_TOKEN }}
      RAILWAY_API_URL: https://backboard.railway.com/graphql/v2
      PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build, verify, and hand off
        shell: bash
        run: |
          # -e is on by default under Actions; turn it off so this script controls its own flow and a
          # tolerated failure (a poll that is not ready yet, a transient API blip) does not abort it.
          set +e -o pipefail

          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::RAILWAY_WORKSPACE_TOKEN secret is not set on this repository"; exit 1
          fi
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::RAILWAY_PROJECT_ID variable is not set on this repository"; exit 1
          fi

          ENV_NAME="uc-nexus-pr-${PR}"
          BACKEND_URL="https://backend-${ENV_NAME}.up.railway.app"
          FRONTEND_URL="https://frontend-${ENV_NAME}.up.railway.app"
          MARKER="<!-- preview-env-ready -->"
          # SUCCESS plus the whole working set: a deployment in one of these is already carrying, or is
          # on its way to carrying, the build it was created for.
          USABLE='^(SUCCESS|BUILDING|DEPLOYING|QUEUED|WAITING|INITIALIZING|NEEDS_APPROVAL)$'

          # --- Railway GraphQL helper --------------------------------------------------------------
          # rgql <query> <variables-json> -> prints .data on success, returns 1 on transport or API
          # error (so callers can retry a poll or hard-fail a one-shot).
          rgql() {
            local q="$1" v="$2" resp body
            body=$(jq -cn --arg q "$q" --argjson v "$v" '{query:$q, variables:$v}') || return 1
            resp=$(curl -sS -X POST "$RAILWAY_API_URL" \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body") || return 1
            if printf '%s' "$resp" | jq -e 'has("errors") and (.errors|length>0)' >/dev/null 2>&1; then
              printf 'Railway API error: %s\n' "$(printf '%s' "$resp" | jq -c '.errors')" >&2
              return 1
            fi
            printf '%s' "$resp" | jq -c '.data'
          }

          # post_sticky <body-file> - create or update the one marker-tagged PR comment.
          post_sticky() {
            local cid payload
            cid=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
              --jq ".[] | select(.body|contains(\"$MARKER\")) | .id" 2>/dev/null | head -1)
            payload=$(jq -cn --rawfile body "$1" '{body:$body}')
            if [ -n "$cid" ]; then
              printf '%s' "$payload" | gh api --method PATCH "repos/${REPO}/issues/comments/${cid}" --input - >/dev/null \
                && echo "updated sticky comment $cid"
            else
              printf '%s' "$payload" | gh api --method POST "repos/${REPO}/issues/${PR}/comments" --input - >/dev/null \
                && echo "posted sticky comment"
            fi
          }

          # --- environment -------------------------------------------------------------------------
          ENV_QUERY='query($id:String!){ environments(projectId:$id){ edges{ node{ id name } } } }'
          ENV_VARS=$(jq -cn --arg id "$PROJECT_ID" '{id:$id}')
          ENV_ID=""; PROD_ENV_ID=""
          resolve_env() {
            local data
            data=$(rgql "$ENV_QUERY" "$ENV_VARS") || return 1
            PROD_ENV_ID=$(printf '%s' "$data" | jq -r '[.environments.edges[]?|select(.node.name=="production")|.node.id][0] // empty')
            ENV_ID=$(printf '%s' "$data" | jq -r --arg n "$ENV_NAME" '[.environments.edges[]?|select(.node.name==$n)|.node.id][0] // empty')
            [ -n "$ENV_ID" ]
          }
          create_env() {
            local out
            [ -n "$PROD_ENV_ID" ] || return 1
            out=$(rgql 'mutation($input:EnvironmentCreateInput!){ environmentCreate(input:$input){ id } }' \
              "$(jq -cn --arg p "$PROJECT_ID" --arg n "$ENV_NAME" --arg s "$PROD_ENV_ID" \
                '{input:{projectId:$p,name:$n,sourceEnvironmentId:$s,ephemeral:true,skipInitialDeploys:true}}')") || return 1
            ENV_ID=$(printf '%s' "$out" | jq -re '.environmentCreate.id // empty') || return 1
            echo "forked $ENV_NAME from production -> $ENV_ID"
            sleep 45  # let the fork's config settle before anything reads or updates it
          }
          # Resolve, else fork. The retry covers three shapes with one loop: the name still reserved by
          # an asynchronous teardown, a transient API failure, and Railway having created the
          # environment concurrently (the next pass resolves it instead of forking a duplicate).
          ensure_env() {
            local i
            for i in $(seq 1 12); do
              resolve_env && { echo "environment $ENV_NAME -> $ENV_ID"; return 0; }
              create_env && return 0
              echo "  fork attempt $i/12 did not go through; retrying"
              sleep 15
            done
            return 1
          }

          # A fork's triggers track production's branch, so Railway would deploy master into this
          # preview on the next push to master. Repoint every trigger in THIS environment at the PR
          # branch, then read them back.
          align_triggers() {
            local data id br left
            data=$(rgql 'query($id:String!){ environment(id:$id){ deploymentTriggers{ edges{ node{ id branch } } } } }' \
              "$(jq -cn --arg id "$ENV_ID" '{id:$id}')") \
              || { echo "::warning::could not read the deployment triggers on $ENV_NAME"; return 1; }
            while read -r id br; do
              [ -n "$id" ] || continue
              [ "$br" = "$HEAD_REF" ] && continue
              rgql 'mutation($id:String!,$input:DeploymentTriggerUpdateInput!){ deploymentTriggerUpdate(id:$id,input:$input){ id branch } }' \
                "$(jq -cn --arg id "$id" --arg b "$HEAD_REF" '{id:$id,input:{branch:$b}}')" >/dev/null \
                && echo "  trigger $id repointed: $br -> $HEAD_REF" \
                || echo "::warning::could not repoint deployment trigger $id from $br to $HEAD_REF"
            done <<<"$(printf '%s' "$data" | jq -r '.environment.deploymentTriggers.edges[]?|"\(.node.id) \(.node.branch)"')"
            left=$(rgql 'query($id:String!){ environment(id:$id){ deploymentTriggers{ edges{ node{ branch } } } } }' \
              "$(jq -cn --arg id "$ENV_ID" '{id:$id}')" \
              | jq -r --arg b "$HEAD_REF" '[.environment.deploymentTriggers.edges[]?.node.branch|select(. != $b)]|join(", ")')
            if [ -n "$left" ]; then
              echo "::warning::deployment triggers still tracking [$left] on $ENV_NAME"
            else
              echo "deployment triggers all track $HEAD_REF"
            fi
          }

          # --- services -----------------------------------------------------------------------------
          # Postgres / backend / frontend are PROJECT-level services and their ids are the same in every
          # environment, so they are resolved from the project. The per-environment instance listing is
          # only a settle-wait: it reads EMPTY for the first seconds of an environment Railway just
          # created (pr-663: env resolved, zero instances, "Postgres is not in the environment"), so it
          # is polled rather than read once.
          SVC_QUERY='query($id:String!){ project(id:$id){ services{ edges{ node{ id name } } } } }'
          svc_data=""
          load_project_services() { svc_data=$(rgql "$SVC_QUERY" "$(jq -cn --arg id "$PROJECT_ID" '{id:$id}')"); }
          proj_svc_id() { printf '%s' "$svc_data" | jq -r --arg n "$1" '[.project.services.edges[]?|select(.node.name==$n)|.node.id][0] // empty'; }
          SI_QUERY='query($id:String!){ environment(id:$id){ serviceInstances{ edges{ node{ serviceId serviceName } } } } }'
          si_data=""
          load_services() {  # polls until the environment reports at least one instance (90s), then settles for what it has
            local i
            for i in $(seq 1 7); do
              si_data=$(rgql "$SI_QUERY" "$(jq -cn --arg id "$ENV_ID" '{id:$id}')") || return 1
              [ "$(printf '%s' "$si_data" | jq -r '[.environment.serviceInstances.edges[]?]|length')" != "0" ] && return 0
              echo "  no service instances in $ENV_NAME yet; waiting for Railway to materialize them ($i/7)"
              sleep 15
            done
            return 0
          }

          # --- variables ---------------------------------------------------------------------------
          read_vars() {  # $1 service id -> the service's variable map, {} when unreadable
            local out
            out=$(rgql 'query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }' \
              "$(jq -cn --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$1" '{p:$p,e:$e,s:$s}')") \
              || { printf '%s' '{}'; return 1; }
            printf '%s' "$out" | jq -c '.variables // {}'
          }
          vars_differ() {  # $1 current map, $2 desired map -> 0 when any desired key is absent or different
            jq -e -n --argjson cur "$1" --argjson want "$2" \
              '[$want|to_entries[]|select(($cur[.key] // null) != .value)]|length > 0' >/dev/null
          }
          upsert_vars() {  # $1 service id, $2 desired map. skipDeploys always - the deploy pass carries them.
            rgql 'mutation($input:VariableCollectionUpsertInput!){ variableCollectionUpsert(input:$input) }' \
              "$(jq -cn --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$1" --argjson v "$2" \
                '{input:{projectId:$p,environmentId:$e,serviceId:$s,variables:$v,skipDeploys:true}}')" >/dev/null
          }

          # --- deployments -------------------------------------------------------------------------
          DEP_QUERY='query($input:DeploymentListInput!,$first:Int){ deployments(input:$input,first:$first){ edges{ node{ id status meta } } } }'
          usable_deployment() {  # $1 service id, $2 sha|any -> a deployment id already carrying this build
            local sid="$1" match="$2" input data
            input=$(jq -cn --arg p "$PROJECT_ID" --arg s "$sid" --arg e "$ENV_ID" '{projectId:$p,serviceId:$s,environmentId:$e}')
            data=$(rgql "$DEP_QUERY" "$(jq -cn --argjson input "$input" '{input:$input,first:100}')") || return 1
            if [ "$match" = "sha" ]; then
              printf '%s' "$data" | jq -r --arg c "$HEAD_SHA" --arg re "$USABLE" \
                '[.deployments.edges[]?.node|select((.meta.commitHash // "")==$c)|select(.status|test($re))][0].id // empty'
            else
              printf '%s' "$data" | jq -r --arg re "$USABLE" \
                '[.deployments.edges[]?.node|select(.status|test($re))][0].id // empty'
            fi
          }
          create_deploy() {  # $1 service id, $2 sha|nosha -> the new deployment id
            local out q v
            if [ "$2" = "sha" ]; then
              q='mutation($s:String!,$e:String!,$c:String!){ serviceInstanceDeployV2(serviceId:$s,environmentId:$e,commitSha:$c) }'
              v=$(jq -cn --arg s "$1" --arg e "$ENV_ID" --arg c "$HEAD_SHA" '{s:$s,e:$e,c:$c}')
            else
              q='mutation($s:String!,$e:String!){ serviceInstanceDeployV2(serviceId:$s,environmentId:$e) }'
              v=$(jq -cn --arg s "$1" --arg e "$ENV_ID" '{s:$s,e:$e}')
            fi
            out=$(rgql "$q" "$v") || return 1
            printf '%s' "$out" | jq -re '.serviceInstanceDeployV2 // empty' || return 1
          }
          DEPLOY_STATUS=""; DEPLOY_ID=""
          wait_deployment() {  # $1 deployment id, $2 label, $3 timeout -> 0 on SUCCESS
            local dep="$1" label="$2" timeout="$3" waited=0 status
            while [ "$waited" -lt "$timeout" ]; do
              status=$(rgql 'query($id:String!){ deployment(id:$id){ status } }' \
                "$(jq -cn --arg id "$dep" '{id:$id}')" | jq -r '.deployment.status // empty')
              DEPLOY_STATUS="${status:-UNREADABLE}"
              echo "  $label $dep: $DEPLOY_STATUS (${waited}s)"
              [ "$status" = "SUCCESS" ] && return 0
              case "$status" in
                CRASHED|FAILED|REMOVED|REMOVING|SKIPPED|SLEEPING) return 1 ;;
              esac
              sleep 15; waited=$((waited+15))
            done
            DEPLOY_STATUS="TIMED OUT at $DEPLOY_STATUS"
            return 1
          }
          # One deployment per service per run: reuse one already carrying this build, else create one
          # and wait on THAT id. force=true when this run changed the service's variables, because a
          # build for the same commit that predates the change cannot carry them.
          ensure_deployed() {  # $1 service id, $2 label, $3 force, $4 sha|nosha
            local sid="$1" label="$2" force="$3" mode="$4" want="any" dep=""
            [ "$mode" = "sha" ] && want="sha"
            if [ "$force" != "true" ]; then
              dep=$(usable_deployment "$sid" "$want")
              [ -n "$dep" ] && echo "$label already has a deployment for this build ($dep); waiting on it"
            fi
            if [ -z "$dep" ]; then
              dep=$(create_deploy "$sid" "$mode") || { echo "::error::could not deploy $label"; exit 1; }
              echo "$label deployment $dep created"
            fi
            DEPLOY_ID="$dep"
            wait_deployment "$dep" "$label" 1200 && return 0
            echo "::warning::$label deployment $dep settled to $DEPLOY_STATUS; deploying it once more"
            dep=$(create_deploy "$sid" "$mode") || { echo "::error::could not re-deploy $label"; exit 1; }
            DEPLOY_ID="$dep"
            wait_deployment "$dep" "$label" 1200 && return 0
            echo "::error::$label deployment $dep settled to $DEPLOY_STATUS"
            exit 1
          }

          # A volumeless Postgres reaches SUCCESS while it crash-loops, so ask the deployment's own
          # runtime logs for the line rather than trusting its status or a volume query.
          pg_volume_missing() {
            local hits
            [ -n "$DEPLOY_ID" ] || return 1
            hits=$(rgql 'query($d:String!,$l:Int,$f:String){ deploymentLogs(deploymentId:$d,limit:$l,filter:$f){ message } }' \
              "$(jq -cn --arg d "$DEPLOY_ID" --arg f "Railway volume not mounted" '{d:$d,l:20,f:$f}')" \
              | jq -r '[.deploymentLogs[]?]|length')
            [ -n "$hits" ] && [ "$hits" != "0" ]
          }
          pg_bringup() {  # 0 = up with its volume, 1 = volumeless and unhealable in place
            ensure_deployed "$PG_ID" "Postgres" false nosha
            sleep 10  # let a crash-looping container emit its first lines
            pg_volume_missing || { echo "Postgres is up with its volume mounted"; return 0; }
            echo "Postgres is crash-looping on a missing volume mount; creating its volume and redeploying"
            rgql 'mutation($input:VolumeCreateInput!){ volumeCreate(input:$input){ id } }' \
              "$(jq -cn --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$PG_ID" \
                '{input:{projectId:$p,environmentId:$e,serviceId:$s,mountPath:"/var/lib/postgresql/data"}}')" >/dev/null \
              || echo "::warning::volumeCreate did not go through; redeploying anyway"
            ensure_deployed "$PG_ID" "Postgres (volume heal)" true nosha
            sleep 10
            pg_volume_missing && return 1
            echo "Postgres is up with its volume mounted"
            return 0
          }

          # --- session key -------------------------------------------------------------------------
          # K lives nowhere but the PR comment (the verifier-not-credential shape every testing var
          # uses), so it is chosen before anything else can fail: a stranded environment still gets a
          # comment carrying the link that starts working once it recovers. Never echoed.
          existing_body=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body|contains(\"$MARKER\")) | .body" 2>/dev/null)
          K=$(printf '%s' "$existing_body" | grep -oE 'session\?key=[A-Za-z0-9_-]+' | head -1 | sed 's/.*key=//')
          if [ -z "$K" ]; then
            K=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
            echo "minted a session key for this PR"
          else
            echo "reusing the session key already in this PR's comment"
          fi
          KHASH=$(printf '%s' "$K" | sha256sum | cut -d' ' -f1)

          fail_stranded() {
            local body_file="${RUNNER_TEMP}/preview-comment.md"
            {
              echo "$MARKER"
              echo "test environment: stranded by Railway provisioning"
              echo ""
              echo "no working Postgres volume, on this environment or on a fresh fork of production. the backend cannot come up without its database."
              echo ""
              echo "re-run preview-env to retry. the sign-in link works once an environment is up:"
              echo "${BACKEND_URL}/testing/session?key=${K}"
              echo ""
              echo "frontend $FRONTEND_URL"
              echo "backend $BACKEND_URL"
            } > "$body_file"
            post_sticky "$body_file"
            echo "::error::no working Postgres could be brought up, even on a fresh fork of production; re-run the workflow to retry"
            exit 1
          }

          # --- provision: environment, triggers, variables, Postgres --------------------------------
          PG_ID=""; BE_ID=""; FE_ID=""; BE_FORCE=false
          provision() {
            local be_vars desired pair
            BE_FORCE=false
            ensure_env || { echo "::error::could not resolve or create environment $ENV_NAME (production env id: ${PROD_ENV_ID:-unresolved})"; exit 1; }
            align_triggers
            load_project_services || { echo "::error::could not list the project's services"; exit 1; }
            PG_ID=$(proj_svc_id "Postgres"); BE_ID=$(proj_svc_id "backend"); FE_ID=$(proj_svc_id "frontend")
            for pair in "Postgres=$PG_ID" "backend=$BE_ID" "frontend=$FE_ID"; do
              if [ -z "${pair#*=}" ]; then echo "::error::service '${pair%%=*}' is not in the project"; exit 1; fi
            done
            load_services || { echo "::error::could not list the service instances in $ENV_NAME"; exit 1; }
            echo "services: Postgres=$PG_ID backend=$BE_ID frontend=$FE_ID"

            be_vars=$(read_vars "$BE_ID"); [ -n "$be_vars" ] || be_vars='{}'
            desired=$(jq -cn --arg k "$KHASH" '{TESTING_SESSION_KEY_HASH:$k}')

            if vars_differ "$be_vars" "$desired"; then
              upsert_vars "$BE_ID" "$desired" || { echo "::error::could not set the backend testing variables"; exit 1; }
              BE_FORCE=true
              echo "set the backend testing variables"
            else
              echo "backend testing variables already current"
            fi

            pg_bringup
          }

          provision; pg_rc=$?
          if [ "$pg_rc" = "1" ]; then
            # A stranded environment cannot be repaired in place, so replace it wholesale.
            echo "deleting the stranded environment and forking a fresh one from production"
            rgql 'mutation($id:String!){ environmentDelete(id:$id) }' "$(jq -cn --arg id "$ENV_ID" '{id:$id}')" >/dev/null \
              || echo "::warning::could not delete the stranded environment; forking a fresh one anyway"
            ENV_ID=""
            provision; pg_rc=$?
            [ "$pg_rc" = "1" ] && fail_stranded
          fi

          # --- deploy the rest, in dependency order ------------------------------------------------
          ensure_deployed "$BE_ID" "backend" "$BE_FORCE" sha
          BE_DEPLOY_ID="$DEPLOY_ID"
          ensure_deployed "$FE_ID" "frontend" false sha

          # --- readiness gate ----------------------------------------------------------------------
          # backend /health, graphql, sign-in, frontend. The relay is not in it: the workstation relay
          # is a machine in the office that can be off, and a green check with a "relay: DOWN" line is
          # the correct answer to that.
          SIGN_IN="${BACKEND_URL}/testing/session?key=${K}"
          BACKEND_READY=false; FRONTEND_READY=false; GQL_READY=false; SIGNIN_READY=false
          RELAY_LINE="relay: DOWN. the workstation relay is not dialling this environment. GP-dependent testing waits until it is up - tell the user"

          wait_http_200() {  # $1 url, $2 label, $3 timeout
            local url="$1" label="$2" timeout="$3" waited=0 code
            while [ "$waited" -lt "$timeout" ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)
              if [ "$code" = "200" ]; then echo "  $label 200 (${waited}s)"; return 0; fi
              echo "  $label -> $code (${waited}s)"
              sleep 15; waited=$((waited+15))
            done
            return 1
          }
          # /health carries relay_connected and relay_companies. Read ONCE, and only to report: nothing
          # below ever branches on the answer and RELAY_LINE never reaches the exit status.
          read_relay_line() {
            local body conn companies
            body=$(curl -s --max-time 15 "$BACKEND_URL/health")
            conn=$(printf '%s' "$body" | jq -r '.relay_connected // false' 2>/dev/null)
            companies=$(printf '%s' "$body" | jq -r '[.relay_companies[]?]|join(", ")' 2>/dev/null)
            if [ "$conn" = "true" ]; then
              RELAY_LINE="relay: connected, companies ${companies:-none reported}"
            fi
            echo "$RELAY_LINE"
          }
          # /testing/session answers 302 (mint + redirect) only when the key hash is live on the RUNNING
          # backend AND the Clerk mint works, so this - not /health - is what proves the handed-out link
          # works. No -L, so the minted ticket is discarded. Polled, because a rollout can still be
          # cutting over. 000 on transport error.
          wait_signin_302() {  # $1 timeout
            local timeout="$1" waited=0 code
            while [ "$waited" -lt "$timeout" ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SIGN_IN" || echo 000)
              if [ "$code" = "302" ]; then echo "  sign-in 302 (${waited}s)"; return 0; fi
              echo "  sign-in -> $code (${waited}s)"
              sleep 15; waited=$((waited+15))
            done
            return 1
          }

          # The backend refuses to boot on a branch that is behind production's migrations and says so in
          # one line. That is a branch problem, not an environment one, so the comment names the line
          # instead of the gate. Same deploymentLogs query the Postgres crash-loop check uses.
          migration_block_line() {
            [ -n "$BE_DEPLOY_ID" ] || return 1
            rgql 'query($d:String!,$l:Int,$f:String){ deploymentLogs(deploymentId:$d,limit:$l,filter:$f){ message } }' \
              "$(jq -cn --arg d "$BE_DEPLOY_ID" --arg f "merge master into the branch" '{d:$d,l:20,f:$f}')" \
              | jq -r '[.deploymentLogs[]?.message|select(test("merge master into the branch"))][0] // empty'
          }

          wait_http_200 "$BACKEND_URL/health" "backend /health" 420 && BACKEND_READY=true
          if [ "$BACKEND_READY" = "true" ]; then
            read_relay_line
            gcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$BACKEND_URL/graphql" \
              -H 'Content-Type: application/json' --data '{"query":"{ __typename }"}' || echo 000)
            echo "graphql probe -> $gcode"; [ "$gcode" = "200" ] && GQL_READY=true
            wait_signin_302 300 && SIGNIN_READY=true
          fi
          wait_http_200 "$FRONTEND_URL/" "frontend /" 300 && FRONTEND_READY=true

          # --- the one sticky comment --------------------------------------------------------------
          # The comment is the whole handoff: a reading agent works from it and from the check, and from
          # nothing else. Printed in both bodies, because item 2 is about the red one.
          print_protocol() {
            echo "agent protocol"
            echo "1. the preview-env check and this comment are the only source of truth for this environment. do not query railway and do not read the workflow to diagnose it"
            echo "2. red check: re-run it once (gh run rerun ${RUN_ID}). still red: report the gate this comment names to the user and stop"
            echo "3. relay DOWN: tell the user the workstation relay must be up, then poll ${BACKEND_URL}/health every two minutes. do not test GP-dependent flows meanwhile. do not install, configure, or look for a relay anywhere, on any machine"
            echo "4. never merge the PR under test. the environment is deleted on close"
            echo "5. reset is the DevAction: reset data button. it re-clones production into this PR's copy and touches nothing else"
          }

          body_file="${RUNNER_TEMP}/preview-comment.md"
          if [ "$BACKEND_READY" = "true" ] && [ "$FRONTEND_READY" = "true" ] \
            && [ "$GQL_READY" = "true" ] && [ "$SIGNIN_READY" = "true" ]; then
            {
              echo "$MARKER"
              echo "test environment ready"
              echo ""
              echo "sign in (navigate once, lands on /app as the e2e account):"
              echo "$SIGN_IN"
              echo ""
              print_protocol
              echo ""
              echo "$RELAY_LINE"
              echo ""
              echo "frontend $FRONTEND_URL"
              echo "backend $BACKEND_URL"
            } > "$body_file"
            READY=true
          else
            MIGRATION_LINE=""
            [ "$BACKEND_READY" = "true" ] || MIGRATION_LINE=$(migration_block_line)
            {
              echo "$MARKER"
              echo "test environment: not fully ready"
              echo ""
              if [ -n "$MIGRATION_LINE" ]; then
                echo "failing gate: the backend will not boot on this branch."
                echo "$MIGRATION_LINE"
              else
                echo "backend healthy: $BACKEND_READY"
                echo "frontend healthy: $FRONTEND_READY"
                echo "graphql answering: $GQL_READY"
                echo "sign-in link answering (302): $SIGNIN_READY"
              fi
              echo ""
              echo "the sign-in link works once it recovers:"
              echo "$SIGN_IN"
              echo ""
              print_protocol
              echo ""
              echo "$RELAY_LINE"
              echo ""
              echo "frontend $FRONTEND_URL"
              echo "backend $BACKEND_URL"
            } > "$body_file"
            READY=false
          fi
          post_sticky "$body_file"

          if [ "$READY" != "true" ]; then
            if [ -n "$MIGRATION_LINE" ]; then
              echo "::error::${MIGRATION_LINE}"
            else
              echo "::error::the PR test environment did not come up fully (backend=$BACKEND_READY frontend=$FRONTEND_READY graphql=$GQL_READY signin=$SIGNIN_READY)"
            fi
            exit 1
          fi
          echo "test environment ready; the sign-in link is in the PR comment"

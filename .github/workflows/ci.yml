name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # The frontend is split three ways (#837): the Vitest run alone took 5 to 7 minutes in one job, most
  # of it a handful of heavy dialog tests, so it runs as parallel shards while lint and build run once
  # beside them. The `Frontend` job at the end is the one the master ruleset requires by name; it only
  # gathers the results, so the required check keeps its name and no ruleset change is needed.
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red shard does not hide a second one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [frontend-build, frontend-tests]
    # Runs even when a shard failed or was cancelled, so the required check reports red rather than
    # being left pending forever, which would block the merge without saying why.
    if: always()
    steps:
      - name: Every frontend job passed
        run: |
          echo "build: ${{ needs.frontend-build.result }}, tests: ${{ needs.frontend-tests.result }}"
          test "${{ needs.frontend-build.result }}" = success
          test "${{ needs.frontend-tests.result }}" = success

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: uc_nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d uc_nexus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/uc_nexus
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - run: pip install poetry
      - run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Run tests
        run: poetry run pytest

      - name: Validate migrations
        run: poetry run alembic upgrade head

  relay:
    name: Relay
    # Windows because the relay is a Windows-only deployable and its tests touch DPAPI, the HKCU
    # autostart key, and the single-instance mutex. Health + auth + pure logic only - never GP.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - run: pip install poetry
      - run: poetry install --no-interaction --with dev

      - name: Ruff lint
        run: poetry run ruff check src tests

      - name: Run tests
        run: poetry run pytest

  migration-integrity:
    name: Migration Integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: uc_nexus_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d uc_nexus_migrations"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/uc_nexus_migrations
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - run: pip install poetry
      - run: poetry install --no-interaction

      - name: Fresh upgrade
        run: poetry run alembic upgrade head

      - name: Downgrade to base
        run: poetry run alembic downgrade base

      - name: Re-upgrade (idempotency check)
        run: poetry run alembic upgrade head

      - name: Verify models match migrations
        run: poetry run alembic check

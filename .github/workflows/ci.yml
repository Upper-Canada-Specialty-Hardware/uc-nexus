name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # #869: which parts of the repo this pull request touches. A job whose part is untouched is skipped,
  # and GitHub counts a job skipped by its `if` as passing for a required check, so the ruleset's
  # checks still report on every PR. Pushes to master always run everything (Railway deploys behind
  # master CI), and so does any change to this file. If this job itself fails, every job runs: a
  # failed detection must never turn into a skipped, and so green, check.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
      relay: ${{ steps.diff.outputs.relay }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            files=".github/workflows/ci.yml"
          else
            files=$(git diff --name-only "$BASE...$HEAD")
          fi
          echo "$files"
          all=false
          echo "$files" | grep -q '^\.github/workflows/ci\.yml$' && all=true
          for part in frontend backend relay; do
            if [ "$all" = true ] || echo "$files" | grep -q "^$part/"; then
              echo "$part=true" >> "$GITHUB_OUTPUT"
            else
              echo "$part=false" >> "$GITHUB_OUTPUT"
            fi
          done

  # The frontend is split three ways (#837): the Vitest run alone took 5 to 7 minutes in one job, most
  # of it a handful of heavy dialog tests, so it runs as parallel shards while lint and build run once
  # beside them. The `Frontend` job at the end is the one the master ruleset requires by name; it only
  # gathers the results, so the required check keeps its name and no ruleset change is needed.
  frontend-build:
    name: Frontend build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # #870: setup-node's npm cache only saves the download - npm ci still unpacks and links every
      # package on every run. The installed node_modules is restored whole instead, keyed on the exact
      # node version and the lockfile, and npm ci runs only when no copy matches.
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - run: npm run lint
      - run: npm run build

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red shard does not hide a second one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # #870: the same node_modules cache as the build job, under the same key, so whichever job runs
      # first on a new lockfile saves it and the rest restore it.
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [changes, frontend-build, frontend-tests]
    # Runs even when a shard failed or was cancelled, so the required check reports red rather than
    # being left pending forever, which would block the merge without saying why.
    if: always()
    steps:
      - name: Every frontend job passed
        run: |
          echo "changes: ${{ needs.changes.result }} (frontend=${{ needs.changes.outputs.frontend }}), build: ${{ needs.frontend-build.result }}, tests: ${{ needs.frontend-tests.result }}"
          # #869: the frontend was not touched, so its jobs were skipped on purpose.
          if [ "${{ needs.changes.result }}" = success ] && [ "${{ needs.changes.outputs.frontend }}" = false ]; then
            exit 0
          fi
          test "${{ needs.frontend-build.result }}" = success
          test "${{ needs.frontend-tests.result }}" = success

  backend:
    name: Backend
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: uc_nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d uc_nexus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/uc_nexus
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - run: pip install poetry
      - run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Run tests
        run: poetry run pytest

      - name: Validate migrations
        run: poetry run alembic upgrade head

  relay:
    name: Relay
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relay == 'true') }}
    # Windows because the relay is a Windows-only deployable and its tests touch DPAPI, the HKCU
    # autostart key, and the single-instance mutex. Health + auth + pure logic only - never GP.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - run: pip install poetry
      - run: poetry install --no-interaction --with dev

      - name: Ruff lint
        run: poetry run ruff check src tests

      - name: Run tests
        run: poetry run pytest

  migration-integrity:
    name: Migration Integrity
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: uc_nexus_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d uc_nexus_migrations"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/uc_nexus_migrations
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - run: pip install poetry
      - run: poetry install --no-interaction

      - name: Fresh upgrade
        run: poetry run alembic upgrade head

      - name: Downgrade to base
        run: poetry run alembic downgrade base

      - name: Re-upgrade (idempotency check)
        run: poetry run alembic upgrade head

      - name: Verify models match migrations
        run: poetry run alembic check

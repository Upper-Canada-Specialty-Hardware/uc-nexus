# Copy to config.toml and fill in. config.toml is gitignored (it holds the secret).

[server]
host = "127.0.0.1"
port = 7321

[auth]
# generate with:  python -c "import secrets; print(secrets.token_urlsafe(32))"
shared_secret = "REPLACE_ME_RANDOM_TOKEN"

[cors]
allowed_origins = [
  "https://frontend-production-34fc.up.railway.app",
  "http://localhost:5173",
  "http://localhost:8000",
]

[sql]
# 10.0.0.246,1435 is the verified-reachable named-instance endpoint (UCSHSQL2\MSSQL2014).
# Off-domain the hostname will not resolve; the IP,port form always works on the corp network.
server = "10.0.0.246,1435"
# Driver 17 is installed on the dev box. Driver 18 also works if installed (just change this).
driver = "ODBC Driver 17 for SQL Server"
trusted_connection = true
encrypt = "yes"
trust_server_certificate = true
connection_timeout = 10
command_timeout = 30
# the GP system database holding the company master (SY01500). the companies this relay serves are read
# from there - there is no company list to maintain in this file.
system_db = "DYNAMICS"

[gp.custom_db]
# company -> paired custom warehouse DB holding WHRECLINE101 (read by the company dashboards).
# a company with no entry gets GP-only receipts. sandboxes have no paired DB.
UBC = "PMUBC"
UCSH = "PMUCSH"

[gp.buyers]
# Normally the Create PO dropdown sends the buyer (picked from GET /buyers = GP's registered buyers in
# POP00101). [gp.buyers] is only the FALLBACK when a /po omits buyer_id. The value MUST be a REGISTERED
# GP buyer - eConnect taPoHdr rejects an unregistered BUYERID (error 269); a device hostname is NOT a
# registered buyer. Resolution: by_host -> by_login -> default. Matching is case-insensitive.
default = "mira"   # fallback registered buyer (TUBC registered buyers: donr, mira)

[gp.buyers.by_host]
# WORKSTATION-HOSTNAME = "registered-buyer"   # device hostname -> a registered GP buyer

[gp.buyers.by_login]
# "DOMAIN\\login" = "registered-buyer"

[logging]
level = "INFO"
file = "relay.log"

[update]
# Which GitHub releases this workstation installs. "stable" (the default) takes full releases only and
# skips anything flagged prerelease; "latest" takes prereleases too. Only the workstation that proves a
# build before it is promoted (gh release edit <tag> --prerelease=false) should be on "latest".
#channel = "stable"

[channel]
# outbound wss channel to the UC Nexus backend's relay gateway. empty backend_url disables it (the
# relay just runs its existing inbound HTTP server, as today). auths on connect with [auth].shared_secret.
backend_url = "wss://backend-production-xxxx.up.railway.app/relay-link"

# Railway PR environments need nothing here: production pushes the current list down this relay's own
# backend socket and the relay dials them, dropping each one when its PR closes. Only the fixed preview
# hostname shape is accepted, and only from the production channel. Set false to dial only what this
# file names. (The old name for this key, discover_preview_backends, still works.)
#accept_pushed_preview_backends = true

# ADD a test backend here, naming ONLY the new one - one channel per URL, so a backend can be tested
# without dropping production (#414). Now mostly for what production cannot know about: a local dev
# backend, or anything outside the Railway project. The same enrolled secret authenticates on all of
# them. The production channel is unrestricted; every other URL is pinned to the sandbox TUBC and
# refuses any other company, reads and writes alike - GP testing happens in TUBC and nowhere else.
# Re-read on a timer since #456, so no restart after editing; remove the URL when you are done with it.
#
# prefer this over overriding backend_url: whether a channel is production is decided by matching the
# baked production URL, so retyping it with one character wrong silently pins PRODUCTION to TUBC and
# breaks all real GP work. listing only the extra URL cannot express that mistake.
# extra_backend_urls = ["wss://backend-pr-414.up.railway.app/relay-link"]

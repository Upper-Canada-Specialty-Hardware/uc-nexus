# Copy to config.toml and fill in. config.toml is gitignored (it holds the secret).

[server]
host = "127.0.0.1"
port = 7321

[auth]
# generate with:  python -c "import secrets; print(secrets.token_urlsafe(32))"
shared_secret = "REPLACE_ME_RANDOM_TOKEN"

[cors]
allowed_origins = [
  "https://ucnexus-frontend-production.up.railway.app",
  "http://localhost:5173",
  "http://localhost:8000",
]

[sql]
# 10.0.0.246,1435 is the verified-reachable named-instance endpoint (UCSHSQL2\MSSQL2014).
# Off-domain the hostname will not resolve; the IP,port form always works on the corp network.
server = "10.0.0.246,1435"
# Driver 17 is installed on the dev box. Driver 18 also works if installed (just change this).
driver = "ODBC Driver 17 for SQL Server"
trusted_connection = true
encrypt = "yes"
trust_server_certificate = true
connection_timeout = 10
command_timeout = 30

[gp]
# HARD GUARDRAIL: sandboxes only. NEVER add UBC or UCSH (production) here.
default_company = "TUBC"
allowed_companies = ["TUBC", "TUCSH"]

[gp.custom_db]
# company -> paired custom warehouse DB holding WHRECLINE101 (read by the company dashboards).
# only applied when the company is also allowed. sandboxes have no paired DB (GP-only receipts).
UBC = "PMUBC"
UCSH = "PMUCSH"

[gp.buyers]
# GP BUYERID is free text in POP10100 (no buyer-master to validate against). the relay fills it from
# the WORKSTATION when the /po request omits buyer_id - the machine that knows the device is the relay.
# company device names are traceable to individuals via an internal system, so the device name itself
# is a valid buyer handle. resolution order:
#   by_host (explicit map) -> by_login (SSPI login) -> use_hostname (the device's own name) -> default.
# matching is case-insensitive; the result is truncated to GP's char(15) BUYERID width.
use_hostname = true   # use socket.gethostname() as the buyer on every workstation, no per-host config
default = "mira"      # final fallback if use_hostname is off / the hostname is empty (TUBC test = "mira")

[gp.buyers.by_host]
# explicit override for a machine whose name should NOT be the buyer:
# WORKSTATION-HOSTNAME = "Buyer Name"

[gp.buyers.by_login]
# "DOMAIN\\login" = "Buyer Name"

[logging]
level = "INFO"
file = "relay.log"
